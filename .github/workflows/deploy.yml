name: Deploy Job Tracker

# Runs on every push to main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 1. Database, file storage, server functions and the team login, in Supabase.
  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_YES: "1"   # hosted changes need an explicit yes in CI
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - name: Work out the project
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')
          test -n "$ref" || { echo "Set the SUPABASE_URL variable"; exit 1; }
          echo "REF=$ref" >> "$GITHUB_ENV"
          echo "SITE=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          key=$(curl -sS "https://api.supabase.com/v1/projects/$ref/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                | jq -r '[.[] | select(.name=="service_role" or .type=="secret")][0].api_key')
          test -n "$key" && test "$key" != "null" || { echo "Couldn't read the project's server key"; exit 1; }
          echo "::add-mask::$key"
          echo "SERVICE_KEY=$key" >> "$GITHUB_ENV"
      - name: Make sure the office login exists (first admin until everyone has their own)
        env:
          TEAM_EMAIL: ${{ vars.TEAM_EMAIL }}
          TEAM_PASSWORD: ${{ secrets.TEAM_PASSWORD }}
        run: |
          set -e
          if [ -z "$TEAM_EMAIL" ]; then echo "No TEAM_EMAIL variable, skipping"; exit 0; fi
          api="$SUPABASE_URL/auth/v1/admin/users"
          id=$(curl -sS "$api?per_page=1000" -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
               | jq -r --arg e "$(echo "$TEAM_EMAIL" | tr 'A-Z' 'a-z')" '.users[] | select(.email==$e) | .id')
          if [ -z "$id" ] && [ -n "$TEAM_PASSWORD" ]; then
            jq -n --arg e "$TEAM_EMAIL" --arg p "$TEAM_PASSWORD" '{email:$e,password:$p,email_confirm:true}' \
              | curl -sS -f -o /dev/null -X POST "$api" -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Content-Type: application/json" --data-binary @-
            echo "Office login created."
          else echo "Office login already exists."; fi
      - name: Set up the hub database, rules and storage
        env:
          TEAM_EMAIL: ${{ vars.TEAM_EMAIL }}
        run: |
          set -e
          q() { jq -n --arg q "$1" '{query:$q}' > /tmp/q.json
                code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
                cat /tmp/out.json; echo; test "$code" -lt 300; }
          q "$(cat supabase/sql/hub.sql)"
          if [ -n "$TEAM_EMAIL" ]; then q "select public.hub_bootstrap('$(echo "$TEAM_EMAIL" | sed "s/'/''/g")') as result"; fi
      - name: Sign-in settings (invites only, emails from the Bison Gmail)
        env:
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -e
          jq -n --arg site "$SITE" --arg user "$GMAIL_USER" --arg pass "$GMAIL_APP_PASSWORD" '
            {site_url:$site, uri_allow_list:($site+"**"), disable_signup:true,
             mailer_subjects_invite:"You are invited to the Bison Job Tracker",
             mailer_templates_invite_content:"<p>Hi,</p><p>You have been added to the Bison Job Tracker. Tap the button to choose your password:</p><p><a href=\"{{ .ConfirmationURL }}\" style=\"background:#F5B700;color:#1D2733;padding:10px 18px;border-radius:6px;font-weight:700;text-decoration:none\">Set my password</a></p><p>The link works once. If it has expired, ask an admin to resend it.</p><p>Bison Developments</p>",
             mailer_subjects_recovery:"Set your Bison Job Tracker password",
             mailer_templates_recovery_content:"<p>Tap the button to choose a new password for the Bison Job Tracker:</p><p><a href=\"{{ .ConfirmationURL }}\" style=\"background:#F5B700;color:#1D2733;padding:10px 18px;border-radius:6px;font-weight:700;text-decoration:none\">Set my password</a></p><p>If you did not ask for this, you can ignore this email.</p><p>Bison Developments</p>"}
            + (if $pass != "" and $user != "" then {smtp_admin_email:$user, smtp_host:"smtp.gmail.com", smtp_port:"465", smtp_user:$user, smtp_pass:$pass, smtp_sender_name:"Bison Developments", rate_limit_email_sent:30} else {} end)' > /tmp/auth.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/auth.json)
          rm -f /tmp/auth.json
          echo "status $code"; test "$code" -lt 300 || { jq '{message,error}' /tmp/out.json 2>/dev/null || true; exit 1; }
      - name: Store server secrets
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL_QUICK: ${{ vars.AI_MODEL_QUICK }}
          AI_MODEL_DEFAULT: ${{ vars.AI_MODEL_DEFAULT }}
          AI_MODEL_COMPLEX: ${{ vars.AI_MODEL_COMPLEX }}
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          HUB_SERVICE_KEY="$SERVICE_KEY"; HUB_SITE_URL="$SITE"
          : > /tmp/secrets.env
          for k in AI_PROVIDER AI_MODEL_QUICK AI_MODEL_DEFAULT AI_MODEL_COMPLEX GMAIL_USER ANTHROPIC_API_KEY XAI_API_KEY OPENAI_API_KEY GMAIL_APP_PASSWORD HUB_SERVICE_KEY HUB_SITE_URL; do
            v="${!k}"; [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> /tmp/secrets.env
          done
          supabase secrets set --remote="$REF" --env-file /tmp/secrets.env --yes
          rm -f /tmp/secrets.env
      - name: Deploy server functions
        run: |
          # The connector uses the app's own build-schedule code, copied fresh from tracker.html on every deploy.
          python3 scripts/extract_schedule.py
          for f in jt-ai jt-mail hub-admin; do supabase functions deploy "$f" --remote="$REF" --use-api --yes; done
          # The connector is reached with each person's private link (no app sign-in), so the gateway's sign-in check is off for it.
          supabase functions deploy jt-mcp --remote="$REF" --use-api --no-verify-jwt --yes

  # 2. The website itself, on GitHub Pages.
  site:
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TEAM_EMAIL: ${{ vars.TEAM_EMAIL }}
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub sometimes can't see a just-uploaded site bundle yet ("Found 0 artifacts"); a short wait avoids that.
      - run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
