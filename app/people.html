<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>People & Sign-ins</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E7EAE8;--panel:#fff;--panel2:#F4F6F5;--ink:#1D2733;--muted:#5C6975;--line:#D2D8D5;--yellow:#F5B700;--yellow-soft:#FFF3C4;--green:#2E7D4F;--green-soft:#DDF0E3;--red:#B83227;--red-soft:#F8DEDA;--blue:#2F5F8A;--blue-soft:#DCE8F3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A20;--panel:#1D252D;--panel2:#232C35;--ink:#E5E9ED;--muted:#9AA6B1;--line:#303C47;--yellow-soft:#3D3310;--green:#5DBB84;--green-soft:#1C3527;--red:#E0685C;--red-soft:#3D1F1C;--blue:#79A8D4;--blue-soft:#1C2D3D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A20;--panel:#1D252D;--panel2:#232C35;--ink:#E5E9ED;--muted:#9AA6B1;--line:#303C47;--yellow-soft:#3D3310;--green:#5DBB84;--green-soft:#1C3527;--red:#E0685C;--red-soft:#3D1F1C;--blue:#79A8D4;--blue-soft:#1C2D3D;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,sans-serif;padding:20px 16px 60px}
button,input,select{font:inherit;color:inherit}
main{max-width:1060px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font:700 28px "Barlow Semi Condensed","Barlow",sans-serif;margin:0}
.back{margin-left:auto;color:var(--ink);font-weight:600}
p.lead{color:var(--muted);margin:0 0 16px;max-width:75ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.add{display:grid;grid-template-columns:1.2fr 1.4fr 1fr 1.1fr auto;gap:10px;align-items:end}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel);min-width:0}
input:focus,select:focus{outline:3px solid var(--yellow);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)}.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1D2733}
.btn.sm{padding:5px 10px;font-size:14px}.btn:disabled{opacity:.55;cursor:default}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.off td{opacity:.55}
td input,td select{width:100%;padding:6px 8px}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;white-space:nowrap;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.st.active{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.st.invited{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.st.no_login{background:var(--yellow-soft);border-color:var(--yellow);color:#8A6400}
.acts{display:flex;gap:6px;justify-content:flex-end}
.help{font-size:14px;color:var(--muted);display:grid;gap:4px}
.help b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;font-weight:600;display:none;max-width:92vw;z-index:20}
dialog{border:0;border-radius:10px;padding:20px;width:min(520px,94vw);background:var(--panel);color:var(--ink)}
dialog textarea{width:100%;min-height:90px;font:13px ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel2);color:var(--ink)}
@media (max-width:760px){.add{grid-template-columns:1fr 1fr}.add .btn{grid-column:1/-1}}
</style></head><body>
<main>
  <div class="top"><h1>People &amp; sign-ins</h1><a class="back" href="./">← Back to the Job Tracker</a></div>
  <p class="lead">Everyone signs in with their own email and password. Their <b>access</b> decides what the database lets them see and change, in every Bison app. Their <b>Job Tracker role</b> decides which screens and homes they see here.</p>
  <div id="app"><div class="panel">Loading…</div></div>
</main>
<dialog id="linkDlg"><h3 style="margin-top:0">Invite link</h3><p id="linkMsg" style="color:var(--muted)"></p><textarea id="linkTxt" readonly></textarea>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" id="copyLink">Copy link</button><button class="btn primary" onclick="this.closest('dialog').close()">Done</button></div></dialog>
<div class="toast" id="toast"></div>
<script>
(async () => {
  const ACCESS = [["admin","Admin"],["pm","Project manager"],["field_supervisor","Field supervisor"],["accounting","Accounting"]];
  const WORK = ["Project manager","Field supervisor","Excavation field supervisor","Operations"];
  const STATUS = { active: "Signed in", invited: "Invite sent", no_login: "No sign-in yet", off: "Turned off" };
  const DEFAULT_WORK = { admin: "Operations", pm: "Project manager", field_supervisor: "Field supervisor", accounting: "" };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (s) => document.querySelector(s);
  const toast = (m) => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500); };
  await window.claude.use("db");
  const hub = window.jtHub;
  if (hub.role !== "admin") { $("#app").innerHTML = `<div class="panel">Only admins can manage people. You're signed in as ${esc(hub.me.name)}.</div>`; return; }
  let people = [];
  const call = (body) => hub.callFn("hub-admin", body);
  async function load() { people = (await call({ action: "list" })).people; render(); }
  const sel = (name, opts, cur) => `<select data-f="${name}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === (cur || "") ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  function render() {
    const rows = people.map((p) => `<tr data-id="${p.id}" class="${p.active ? "" : "off"}">
      <td><input data-f="name" value="${esc(p.name)}" aria-label="Name"></td>
      <td><input data-f="email" type="email" value="${esc(p.email || "")}" placeholder="Add email to invite" aria-label="Email"></td>
      <td>${sel("role", ACCESS, p.role)}</td>
      <td>${sel("work_role", [["", "No Job Tracker screens"], ...WORK.map((w) => [w, w])], p.work_role)}</td>
      <td><span class="st ${p.status}">${STATUS[p.status]}</span></td>
      <td><div class="acts">${p.active ? `<button class="btn sm ${p.status === "no_login" ? "primary" : ""}" data-invite ${p.email ? "" : "disabled"}>${p.status === "no_login" ? "Send invite" : "Resend link"}</button><button class="btn sm" data-off ${p.id === hub.me.id ? "disabled" : ""}>Turn off</button>` : `<button class="btn sm" data-on>Turn on</button>`}</div></td></tr>`).join("");
    $("#app").innerHTML = `
    <form class="panel add" id="addForm">
      <label>Name<input name="name" required placeholder="Lucas Manning"></label>
      <label>Email<input name="email" type="email" placeholder="lucas@…"></label>
      <label>Access${sel("role", ACCESS, "pm").replace('data-f="role"', 'name="role"')}</label>
      <label>Job Tracker role${sel("work_role", [["", "No Job Tracker screens"], ...WORK.map((w) => [w, w])], "Project manager").replace('data-f="work_role"', 'name="work_role"')}</label>
      <button class="btn primary">Add person</button>
    </form>
    <div class="panel wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Access</th><th>Job Tracker role</th><th>Sign-in</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="6">No one yet.</td></tr>`}</tbody></table></div>
    <div class="panel help">
      <div><b>Admin</b>: everything in every app, and this page.</div>
      <div><b>Project manager</b>: jobs, tasks, schedules and files; job costs and budgets once BuildTrack joins.</div>
      <div><b>Field supervisor</b>: jobs, tasks, schedules and files. Never sees costs, budgets or financial documents.</div>
      <div><b>Accounting</b>: views jobs here read-only; works in BuildTrack.</div>
      <div style="margin-top:6px">Changes save as you make them. <b>Send invite</b> emails them a link to set their password. If an email doesn't arrive, you'll also get the link to text them.</div>
    </div>`;
  }
  document.addEventListener("submit", async (e) => {
    if (e.target.id !== "addForm") return;
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await call({ action: "save", name: f.get("name"), email: f.get("email"), role: f.get("role"), work_role: f.get("work_role") });
      toast("Added. Use Send invite when you're ready.");
      await load();
    } catch (er) { toast(er.message); }
  });
  document.addEventListener("change", async (e) => {
    const f = e.target.dataset.f, tr = e.target.closest("tr[data-id]");
    if (e.target.name === "role" && e.target.form && e.target.form.id === "addForm") { e.target.form.work_role.value = DEFAULT_WORK[e.target.value]; return; }
    if (!f || !tr) return;
    try { await call({ action: "save", id: tr.dataset.id, [f]: e.target.value.trim() }); toast("Saved"); await load(); }
    catch (er) { toast(er.message); await load(); }
  });
  document.addEventListener("click", async (e) => {
    const tr = e.target.closest("tr[data-id]"); if (!tr) return;
    const id = tr.dataset.id, p = people.find((x) => x.id === id);
    try {
      if (e.target.closest("[data-invite]")) {
        e.target.disabled = true; e.target.textContent = "Sending…";
        const r = await call({ action: "invite", id });
        if (r.link) { $("#linkMsg").textContent = (r.emailed ? `An email is on its way to ${p.email}. ` : `The email didn't go out. `) + `You can also text ${p.name} this link. It works once, so don't share it with anyone else.`; $("#linkTxt").value = r.link; $("#linkDlg").showModal(); }
        else toast(r.emailed ? `Invite emailed to ${p.email}` : "Couldn't send the invite");
        await load();
      }
      if (e.target.closest("[data-off]")) { if (!confirm(`Turn off ${p.name}'s sign-in? They'll be signed out and can't get back in until you turn it on.`)) return; await call({ action: "active", id, active: false }); toast("Sign-in turned off"); await load(); }
      if (e.target.closest("[data-on]")) { await call({ action: "active", id, active: true }); toast("Sign-in turned back on"); await load(); }
    } catch (er) { toast(er.message); await load(); }
  });
  $("#copyLink").onclick = async () => { try { await navigator.clipboard.writeText($("#linkTxt").value); toast("Link copied"); } catch (_) { $("#linkTxt").select(); } };
  load().catch((e) => { $("#app").innerHTML = `<div class="panel">Couldn't load the team: ${esc(e.message)}</div>`; });
})();
</script>
</body></html>
