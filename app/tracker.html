/* ===== Bison AI chat widget (uses the artifact's sample capability) ===== */
const BISON_EMAIL="bisondevelopments@gmail.com";
function initBisonAI(){
  let sampleApi=null,mcpApi=null,hist=[],busy=false;
  const CHIPS=["What's behind schedule?","Which inspections are ready to schedule?","What materials need ordering?","Schedule the plumbing inspection for a home"];
  const $m=()=>document.getElementById("ai-msgs");
  const bai=(c,on)=>document.querySelectorAll(".bai").forEach(x=>x.classList.toggle(c,on));
  let baiT=0;const baiSent=()=>{bai("sent",false);void document.body.offsetWidth;bai("sent",true);clearTimeout(baiT);baiT=setTimeout(()=>bai("sent",false),2300)};
  function ctx(){
    const L=[`Today is ${TODAY}. Current user: ${me||"not set"}.`];
    const act=visibleJobs();
    L.push(`\nACTIVE HOMES (${act.length}):`);
    const areaIds=new Set();
    for(const j of act){
      const its=allItems(j),done=its.filter(t=>isDone(j,t)).length,due=homeDue(j)||{};
      const ak=areaKeys(j);ak.forEach(k=>areaIds.add(k.id));
      L.push(`\n# ${j.name} [home_id=${j.id}]`);
      L.push(`Address: ${addrShort(j)||"n/a"} | Subdivision: ${j.subdivision||"none"} | PM: ${j.pm||"not set"} | Field supervisor: ${j.super||"not set"} | Permit: ${j.permit||"none"} | Start: ${j.start||"?"} | Status: ${statusName(homeStatus(j).v)} | ${done}/${its.length} tasks done${due.due?` | Due ${due.due}`:""}`);
      if(ak.length)L.push(`Jurisdictions: ${ak.map(k=>k.name).join(", ")}`);
      const late=its.filter(t=>!isDone(j,t)&&status(j,t)==="late").map(t=>t.name);
      if(late.length)L.push(`LATE: ${late.join(", ")}`);
      const open=its.filter(t=>!isDone(j,t)&&!isNA(j,t)).slice(0,6).map(t=>t.name);
      if(open.length)L.push(`Next open tasks: ${open.join(", ")}`);
      for(const t of its){
        const x=S(j,t.key),ms=matStage(x);
        if(ms===1)L.push(`Material ready to order: ${t.name}`);
        if(ms===2)L.push(`Material ordered: ${t.name}${x.delivDate?` (delivery ${x.delivDate})`:""}`);
        if(ms===4)L.push(`Material supplied by the sub: ${t.name}`);
        for(const s of t.subs||[]){if(!s.f||!s.f.includes("pf"))continue;const y=S(j,s.key),st=inspStage(y);
          const lbl=y.pf==="pass"?"PASSED":y.pf==="fail"?"FAILED":st===2?`SCHEDULED${y.schedDate?" "+y.schedDate:""}`:st===1?"READY TO SCHEDULE":"not requested";
          L.push(`Inspection "${s.name}" (phase ${t.name}) [inspection_key=${s.key}]: ${lbl}`)}
      }
      const td=todoList(j).filter(([,x])=>!x.done).map(([,x])=>`${x.text}${x.who?" ("+x.who+")":""}${x.due?" due "+x.due:""}`);
      if(td.length)L.push(`Additional to-dos: ${td.join("; ")}`);
    }
    if(pipeSorted().length){L.push(`\nPIPELINE (under contract, not started yet):`);
      pipeSorted().forEach(p=>L.push(`${p.name}${p.subdivision?" ("+p.subdivision+")":""} | Expected start: ${p.expStart||"not set"} | Under contract since: ${p.contract||"?"} | PM: ${p.pm||"not set"} | Field supervisor: ${p.super||"not set"} | To-dos left: ${ptodos(p).filter(([,t])=>!t.done).map(([,t])=>t.text).join(", ")||"none"}${p.notes?" | Notes: "+p.notes:""}`))}
    const ac=areas.filter(a=>areaIds.has(a.id)&&a.contacts);
    if(ac.length){L.push(`\nJURISDICTION CONTACTS (inspectors, permit offices):`);
      ac.forEach(a=>Object.values(a.contacts).filter(Boolean).forEach(c=>L.push(`${a.name}: ${[c.role,c.name,c.email,c.phone,c.notes].filter(Boolean).join(" | ")}`)))}
    if(contacts.length){L.push(`\nCOMPANY CONTACTS (subs, suppliers):`);
      contacts.slice(0,80).forEach(c=>L.push([c.company,(c.types||[c.type]).join("/"),c.role,c.phone,c.email].filter(Boolean).join(" | ")+peopleOf(c).map(x=>"\n   - "+[x.name,x.role,x.phone,x.email].filter(Boolean).join(" | ")).join("")))}
    if(team.length)L.push(`\nTEAM: ${team.map(p=>p.name+" ("+(p.role||"Project manager")+")").join(", ")}`);
    return L.join("\n");
  }
  const SYS=`You are Bison AI, the assistant inside Bison Developments' Job Tracker (a residential homebuilder in Tennessee). Answer from the project data below; if something isn't in the data, say so rather than guessing. Be brief and practical — the reader is a PM or ops person on a laptop or tablet. Plain text, short lines, no markdown tables. Your first sentence is read aloud, so make it a complete short answer on its own.
When the user asks to schedule an inspection: find the home (match on name, lot, street or address loosely) and the inspection, find the right inspector email from the jurisdiction contacts, then call the prepare_inspection tool with a ready-to-send email (subject + body including address, permit number, inspection type and requested date). The email is sent from the company address ${BISON_EMAIL}, so write it on behalf of Bison Developments and sign it with the current user's name on one line, then "Bison Developments", then "${BISON_EMAIL}". Ask the inspector to reply to ${BISON_EMAIL}. If no date was given, ask for "the next available date". If the home or inspection is ambiguous, ask one short question instead of calling the tool. After the tool returns, reply with one line telling them to review the card and tap Send; if they set the date first, sending also marks the inspection scheduled.`;
  function bubble(role,txt){const d=document.createElement("div");d.className="ai-msg "+role;d.textContent=txt;$m().appendChild(d);$m().scrollTop=1e9;return d}
  function welcome(){$m().innerHTML="";bubble("asst","How can I help? Tap the mic and talk, or type. Ask me about any home — what's late, what's waiting on ops, who the inspector is — or tell me to schedule an inspection and I'll draft the email.");
    const c=document.createElement("div");c.className="ai-chips";CHIPS.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="ai-chip";b.textContent=t;b.onclick=()=>send(t);c.appendChild(b)});$m().appendChild(c)}
  function card(a){
    const j=jobs.find(x=>x.id===a.home_id);if(!j)throw new Error("No home with that home_id");
    const s=allItems(j).flatMap(t=>(t.subs||[]).map(x=>({...x,phase:t.name}))).find(x=>x.key===a.inspection_key);if(!s)throw new Error("No inspection with that inspection_key on this home");
    const d=document.createElement("div");d.className="ai-card";
    d.innerHTML=`<b></b><small class="ai-from">From ${BISON_EMAIL}</small><label>To<input data-k="to"></label><label>Subject<input data-k="subject"></label><label>Email<textarea data-k="body" rows="7"></textarea></label>
     <label>Inspection date<input type="date" data-k="date"></label>
     <div class="ai-acts"><a class="btn" data-k="mail" target="_blank" rel="noopener">Open in email</a><button type="button" class="btn" data-k="copy">Copy</button><button type="button" class="btn" data-k="mark">Mark scheduled</button><button type="button" class="btn primary ai-sendbtn" data-k="send">Send</button></div><small class="ai-status" data-k="status" aria-live="polite"></small>`;
    const q=k=>d.querySelector(`[data-k="${k}"]`);
    d.querySelector("b").textContent=`${j.name} · ${s.name}`;
    q("to").value=a.to||"";q("subject").value=a.subject||"";q("body").value=a.body||"";q("date").value=/^\d{4}-\d\d-\d\d$/.test(a.date||"")?a.date:"";
    const upd=()=>{q("mail").href=`mailto:${encodeURIComponent(q("to").value)}?subject=${encodeURIComponent(q("subject").value)}&body=${encodeURIComponent(q("body").value)}`};
    d.addEventListener("input",upd);upd();
    q("copy").onclick=()=>{try{navigator.clipboard.writeText(`Subject: ${q("subject").value}\n\n${q("body").value}`).then(()=>toast("Email copied"),()=>toast("Couldn't copy"))}catch(_){toast("Couldn't copy")}};
    const stat=t=>{q("status").textContent=t};
    let sent=false;
    const markSched=(dt,how)=>{const e={what:"Inspection scheduled",txt:"For "+fmt(dt)+" · "+how,by:me||"",on:TODAY};
      return store.patch(j.id,{state:{[s.key]:{isched:"sched",schedDate:dt,lastNote:e,log:{["n-"+uid()]:{...e,at:Date.now()}}}}})
        .then(()=>{q("mark").disabled=true;q("mark").textContent="Scheduled ✓"})};
    q("mark").onclick=()=>{const dt=q("date").value;if(!dt){toast("Pick the inspection date first");q("date").focus();return}
      markSched(dt,(sent?"emailed ":"for ")+(q("to").value||"inspector")+" via Bison AI").then(()=>{toast("Inspection marked scheduled");baiSent()}).catch(report)};
    if(!mcpApi)q("send").hidden=true;
    q("send").onclick=async()=>{
      const to=q("to").value.split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean);
      if(!to.length||!to.every(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))){toast("Add a valid email address in To");q("to").focus();return}
      if(!q("subject").value.trim()||!q("body").value.trim()){toast("Subject and email can't be empty");return}
      const btn=q("send");btn.disabled=true;btn.textContent="Sending…";stat("");
      try{
        await mcpApi.callTool("Gmail","send_message",{to,subject:q("subject").value.trim(),body:q("body").value,includeSignature:true},{cache:false});
        sent=true;btn.textContent="Sent ✓";baiSent();d.querySelectorAll("input:not([type=date]),textarea").forEach(x=>x.readOnly=true);
        const dt=q("date").value,who=to.join(", ");
        if(dt){await markSched(dt,"emailed "+who+" via Bison AI").catch(report);stat("Email sent to "+who+" and the inspection is marked scheduled for "+fmt(dt)+".");toast("Sent and marked scheduled")}
        else{const e={what:"Inspection request emailed",txt:"To "+who+" via Bison AI",by:me||"",on:TODAY};
          store.patch(j.id,{state:{[s.key]:{lastNote:e,log:{["n-"+uid()]:{...e,at:Date.now()}}}}}).catch(report);
          stat("Email sent to "+who+". Add the date and tap Mark scheduled once the inspector confirms.");toast("Email sent")}
      }catch(e){
        const c=e&&e.code;
        const msg={needs_reauth:"Gmail needs reconnecting: claude.ai Settings → Connectors → Gmail.",
          server_not_connected:"Gmail isn't connected for you. Add it in claude.ai Settings → Connectors, or use Open in email.",
          selection_required:"Choose which Gmail account to use when Claude asks, then tap Send again.",
          not_in_manifest:"Sending through Gmail isn't allowed on this page for you. Use Open in email instead.",
          approval_required:"Sending needs your approval. Tap Send again and choose Allow.",
          blocked_by_policy:"Your organization blocks sending from Gmail here. Use Open in email instead.",
          tool_error:"Gmail refused the message: "+((e&&e.message)||"unknown reason"),
          server_unavailable:"Gmail didn't answer in time. Check your Sent folder before trying again, so the inspector doesn't get it twice.",
          upstream_error:"Something went wrong reaching Gmail. Check your Sent folder before trying again."}[c]
          ||(c==="not_granted"||c==="capability_disabled"?"Sending isn't available in this view. Use Open in email instead.":"Couldn't send. Check your Sent folder before trying again.");
        stat(msg);btn.disabled=false;btn.textContent="Send"}
    };
    $m().appendChild(d);$m().scrollTop=1e9;
    return{shown:true,home:j.name,inspection:s.name};
  }
  const TOOLS=[{name:"prepare_inspection",description:"Show the user an editable inspection-request email card with Send (via their Gmail), Open in email and Mark scheduled buttons. Nothing is sent until the user taps Send.",
    inputSchema:{type:"object",properties:{home_id:{type:"string"},inspection_key:{type:"string"},to:{type:"string",description:"Inspector email address, or empty if unknown"},subject:{type:"string"},body:{type:"string"},date:{type:"string",description:"Requested date YYYY-MM-DD, or empty"}},required:["home_id","inspection_key","subject","body"]},
    execute:a=>card(a)},
    {name:"add_photos",description:"Save the photos the user attached to this message to a home's Photos tab. Only call this when the user has attached photos and wants them filed. Pick the home from the project data (ask if unclear).",
    inputSchema:{type:"object",properties:{home_id:{type:"string",description:"The home's id from the project data"},caption:{type:"string",description:"Optional short caption for the photos"}},required:["home_id"]},
    execute:async a=>{
      if(!aiPics.length)return{error:"No photos are attached to this message. Ask the user to tap the paperclip and attach them."};
      if(!assetsApi)return{error:"Photo storage isn't available in this view."};
      const j=jobs.find(x=>x.id===a.home_id)||jobs.find(x=>(x.name||"").toLowerCase()===String(a.home_id||"").toLowerCase());
      if(!j)return{error:"No home with id "+a.home_id};
      let ok=0;const fails=[];
      for(const f of aiPics){try{const b=await shrinkImage(f),r=await assetsApi.upload(b,{type:b.type||"image/jpeg"}),id="ph-"+uid();
        await store.patch(j.id,{photos:{[id]:{asset:r.id,on:TODAY,at:Date.now(),by:me||"",cap:String(a.caption||"").slice(0,200)}}});ok++}
        catch(e){fails.push(String((e&&e.message)||e))}}
      if(ok){aiPicsSaved=true;render()}
      return{home:j.name,added:ok,failed:fails.length,errors:fails.slice(0,3)};
    }}];
  let aiPics=[],aiPicsSaved=false;
  function aiPicsNote(){const n=document.getElementById("ai-attnote"),a=document.getElementById("ai-att");if(!n)return;
    n.hidden=!aiPics.length;n.textContent=aiPics.length?`📷 ${aiPics.length} photo${aiPics.length===1?"":"s"} attached — say which home (tap 📎 again to replace)`:"";a.classList.toggle("has",!!aiPics.length)}
  async function send(t){
    const inp=document.getElementById("ai-input"),btn=document.getElementById("ai-send");
    const msg=(t||inp.value||"").trim();if(!msg||busy)return;
    inp.value="";inp.style.height="";busy=true;btn.disabled=true;
    const pics=aiPics.slice();bubble("user",msg+(pics.length?`  [📷 ${pics.length} photo${pics.length===1?"":"s"}]`:""));hist.push({role:"user",content:msg+(pics.length?`\n(I attached ${pics.length} photo${pics.length===1?"":"s"}. Use add_photos to save them to a home if I asked.)`:"")});aiPicsSaved=false;
    const typing=document.createElement("div");typing.className="ai-typing";typing.innerHTML='<i class="ai-dot"></i><i class="ai-dot"></i><i class="ai-dot"></i>';$m().appendChild(typing);$m().scrollTop=1e9;
    if(!sampleApi){typing.remove();bubble("asst","The assistant isn't available in this view. Open the tracker in Claude and allow it to ask Claude when prompted.");busy=false;btn.disabled=false;return}
    const convo=hist.slice(-14);const first=convo.findIndex(h=>h.role==="user");
    const input=convo.slice(first).map((h,i)=>i===0?{role:"user",content:SYS+"\n\n=== PROJECT DATA ===\n"+ctx()+"\n=== END DATA ===\n\n"+h.content}:h);
    let el=null;bai("thinking",true);
    try{let imgs=null;if(pics.length){try{imgs=await Promise.all(pics.slice(0,5).map(f=>shrinkImage(f)))}catch(_){imgs=null}}
      const r=await sampleApi(input,{cache:false,tools:TOOLS,...(imgs?{images:imgs}:{}),onText({text}){if(!el){typing.remove();el=bubble("asst","")}el.textContent=text;$m().scrollTop=1e9}});
      typing.remove();if(!el)el=bubble("asst",r.text||"Done.");else el.textContent=r.text||el.textContent;
      hist.push({role:"assistant",content:r.text||"(showed an email card)"});speakReply(r.text||"")}
    catch(e){typing.remove();hist.pop();
      bubble("asst",e&&e.code==="not_granted"?"Permission to ask Claude wasn't granted. You can allow it from this page's Permissions menu.":e&&e.code==="rate_limited"?"Too many requests right now — give it a minute.":"Something went wrong. Try again.")}
    finally{busy=false;btn.disabled=false;bai("thinking",false);if(aiPicsSaved){aiPics=[];aiPicsNote()}}
  }
  const fab=document.getElementById("ai-fab"),panel=document.getElementById("ai-panel");
  function toggle(){const open=panel.hidden;panel.hidden=!open;fab.setAttribute("aria-expanded",String(open));
    if(open){if(!$m().children.length)welcome();
      if(voice&&synth)say("How can I help?",()=>listen(true));else if(SR&&!micBlocked)listen(false);else setTimeout(()=>document.getElementById("ai-input").focus(),50)}
    else{if(synth)synth.cancel();if(rec)try{rec.abort()}catch(_){}setStatus("")}}
  /* ---- voice: built-in browser speech (test version) ---- */
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null,synth=window.speechSynthesis||null;
  let rec=null,listening=false,micBlocked=false,voice=true;
  try{voice=localStorage.getItem("bai_voice")!=="off"}catch(_){}
  const micBtn=document.getElementById("ai-mic"),vBtn=document.getElementById("ai-voice"),stEl=document.getElementById("ai-status");
  function setStatus(t){stEl.textContent=t||"";stEl.hidden=!t}
  function paintVoice(){vBtn.setAttribute("aria-pressed",String(voice));vBtn.title=voice?"Spoken replies on":"Spoken replies off"}
  if(!synth)vBtn.hidden=true;paintVoice();
  if(!SR)micBtn.hidden=true;
  vBtn.onclick=()=>{voice=!voice;paintVoice();if(!voice&&synth)synth.cancel();try{localStorage.setItem("bai_voice",voice?"on":"off")}catch(_){}};
  function say(text,then){if(!voice||!synth||!text){then&&then();return}
    synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=1.05;let done=false;const fin=()=>{if(!done){done=true;then&&then()}};
    u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(2500,text.length*90));synth.speak(u)}
  function speakReply(text){if(!voice||!synth)return;
    const flat=text.replace(/[*_#`>|]/g,"").replace(/\s+/g," ").trim(),parts=flat.match(/[^.!?]+[.!?]+(\s|$)/g)||[flat];
    let out="";for(const x of parts){if((out+x).length>240&&out)break;out+=x}
    say(out.trim(),()=>{if(/\?\s*$/.test(flat)&&!panel.hidden)listen(true)})}
  function listen(auto){
    if(micBlocked){dictateHint();return}
    if(!SR||busy)return;if(synth)synth.cancel();
    if(listening){try{rec.stop()}catch(_){}return}
    const inp=document.getElementById("ai-input");let finalTxt="",heard="";
    rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
    rec.onstart=()=>{listening=true;micBtn.classList.add("on");micBtn.setAttribute("aria-label","Stop listening");setStatus("Listening…")};
    rec.onresult=e=>{let interim="";finalTxt="";for(const r of e.results){if(r.isFinal)finalTxt+=r[0].transcript;else interim+=r[0].transcript}heard=(finalTxt+interim).trim();inp.value=heard};
    rec.onerror=e=>{const c=e.error||"unknown";
      if(c==="not-allowed"||c==="service-not-allowed"){
        if(auto){setStatus("Tap the mic to talk.");return}
        micBlocked=true;try{sessionStorage.setItem("bai_mic","blocked")}catch(_){}
        micBtn.title="Dictate with your keyboard";dictateHint()}
      else if(c==="no-speech")setStatus("Didn't catch that. Tap the mic to try again.");
      else if(c==="audio-capture")setStatus("No microphone found.");
      else if(c!=="aborted")setStatus("Mic problem: "+c)};
    rec.onend=()=>{listening=false;micBtn.classList.remove("on");micBtn.setAttribute("aria-label","Talk");
      if(stEl.textContent==="Listening…")setStatus("");
      const t=(finalTxt||heard).trim();if(t){inp.value="";send(t)}};
    try{rec.start()}catch(err){if(!auto)setStatus("Mic problem: "+((err&&err.message)||err))}
  }
  try{if(sessionStorage.getItem("bai_mic")==="blocked"){micBlocked=true;micBtn.title="Dictate with your keyboard"}}catch(_){}
  function dictateHint(){
    const ua=navigator.userAgent,ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),
      mac=!ios&&/Mac/.test(navigator.platform||ua),win=/Win/.test(navigator.platform||ua);
    const tip=ios?"Tap the microphone on your keyboard and talk, then tap Send.":mac?"Press Fn twice (or the globe key) to start dictation, talk, then press Enter.":win?"Press Windows + H to start dictation, talk, then press Enter.":"Use your device's dictation key to talk into the box.";
    setStatus(tip);const i=document.getElementById("ai-input");if(i)setTimeout(()=>i.focus(),30)}
  micBtn.onclick=()=>listen(false);
  fab.onclick=toggle;document.getElementById("ai-close").onclick=toggle;
  document.getElementById("ai-clear").onclick=()=>{hist=[];welcome()};
  document.getElementById("ai-send").onclick=()=>send();
  document.getElementById("ai-files").addEventListener("change",e=>{aiPics=[...e.target.files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name));e.target.value="";aiPicsNote();document.getElementById("ai-input").focus()});
  const inp=document.getElementById("ai-input");
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}e.stopPropagation()});
  inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,100)+"px"});
  (async()=>{try{sampleApi=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(_){sampleApi=null}
    if(!sampleApi)fab.hidden=true})();
  (async()=>{try{mcpApi=window.claude&&window.claude.use?await window.claude.use("mcp"):null}catch(_){mcpApi=null}})();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initBisonAI);else setTimeout(initBisonAI,0);
</script>
