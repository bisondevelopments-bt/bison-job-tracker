<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAE8;--panel:#FFFFFF;--panel2:#F4F6F5;--ink:#1D2733;--muted:#5C6975;--line:#D2D8D5;
  --yellow:#F5B700;--yellow-soft:#FFF3C4;--green:#2E7D4F;--green-soft:#DDF0E3;--red:#B83227;--red-soft:#F8DEDA;
  --blue:#2F5F8A;--blue-soft:#DCE8F3;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --head:"Barlow Semi Condensed","Barlow",system-ui,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A20;--panel:#1D252D;--panel2:#232C35;--ink:#E5E9ED;--muted:#9AA6B1;--line:#303C47;
  --yellow-soft:#3D3310;--green:#5DBB84;--green-soft:#1C3527;--red:#E0685C;--red-soft:#3D1F1C;--blue:#79A8D4;--blue-soft:#1C2D3D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A20;--panel:#1D252D;--panel2:#232C35;--ink:#E5E9ED;--muted:#9AA6B1;--line:#303C47;
  --yellow-soft:#3D3310;--green:#5DBB84;--green-soft:#1C3527;--red:#E0685C;--red-soft:#3D1F1C;--blue:#79A8D4;--blue-soft:#1C2D3D;color-scheme:dark}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}

.app{display:grid;grid-template-columns:260px 1fr;height:100%}
aside{background:#1D2733;color:#E9EDF0;display:flex;flex-direction:column;overflow:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) aside{background:#0E1317}}
.brand{padding:20px 18px 14px;display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;background:var(--yellow);border-radius:4px;display:grid;place-items:center;color:#1D2733;font:700 18px var(--head)}
.brand .mark{overflow:hidden}.brand .mark img{width:100%;height:100%;display:block}
.brand h1{font-size:22px;color:#fff}
.nav{padding:4px 10px}
.nav button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:none;border:0;color:#D5DCE2;padding:9px 10px;border-radius:6px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:rgba(245,183,0,.16);color:#fff;box-shadow:inset 3px 0 0 var(--yellow)}
.nav .count{margin-left:auto;font-size:13px;color:#9FB0BE}
.nav .count.bad{color:#FF9C90}
.sub{padding:14px 20px 4px;font-size:13px;color:#8FA0AE;font-weight:600}
.jobbtn .mini{margin-left:auto;width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;flex:none}
.jobbtn .mini i{display:block;height:100%;background:var(--yellow)}
.jobbtn span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{margin-top:auto;padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;position:sticky;bottom:0;z-index:2;background:inherit;border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -10px 16px -6px rgba(0,0,0,.35)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1D2733}
.btn.danger{color:var(--red)}
.btn.ghost-dark{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#E9EDF0}

main{overflow:auto;min-width:0}
.top{padding:22px 28px 0}
.top h2{font-size:30px}
.meta{color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 18px}
.meta b{color:var(--ink);font-weight:600}
.progress{display:flex;align-items:center;gap:12px;margin-top:14px;max-width:560px}
.bar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:2px solid var(--line);align-items:flex-end;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-color:var(--yellow)}
.tabs .right{margin-left:auto;display:flex;gap:8px;padding-bottom:8px;align-items:center}
.toggle{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.body{padding:18px 28px 60px}
.body:has(.todobox){padding-bottom:0}
.banner{margin:14px 28px 0;padding:10px 14px;border-radius:6px;background:var(--yellow-soft);font-size:14px}

/* phases & tasks */
.cbox{display:grid;place-items:center;margin-top:2px;cursor:pointer}
.cbox input{appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:50%;margin:0;display:grid;place-items:center;background:var(--panel);cursor:pointer}
.cbox input:checked{background:var(--green);border-color:var(--green)}
.cbox input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.cbox.locked,.cbox.locked input{cursor:not-allowed}
.cbox.locked input{pointer-events:none;border-style:dashed;border-color:var(--line);background:var(--panel2)}
.cbox.late input:not(:checked){border-color:var(--red)}
.cbox.na input{border-style:dashed;opacity:.5}
.fields{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ck,.dt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:14px;background:var(--panel);min-height:32px}
.ck{cursor:pointer;user-select:none}
.ck input{accent-color:var(--green);width:17px;height:17px;margin:0;cursor:pointer}
.ck:has(input:checked){background:var(--green-soft);border-color:var(--green)}
.ck.main{font-weight:600}
.ck.na-ck:has(input:checked){background:var(--panel2);border-color:var(--muted)}
.dt span{color:var(--muted)}
.dt input{border:0;background:none;padding:0;font-size:14px;min-width:0}
.dt.late{border-color:var(--red);background:var(--red-soft)}
.pf{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:32px}
.pf button{border:0;background:var(--panel);padding:4px 11px;font-size:14px;font-weight:600;color:var(--muted)}
.pf button+button{border-left:1px solid var(--line)}
.pf button.pass.on{background:var(--green);color:#fff}
.pf button.fail.on{background:var(--red);color:#fff}

/* board */

/* timeline */
.tl{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.tl-grid{position:relative}
.tl-row{display:flex;border-bottom:1px solid var(--line);min-height:34px;align-items:center}
.tl-row.ph{background:var(--panel2);font-family:var(--head);font-weight:700}
.tl-lab{position:sticky;left:0;z-index:2;width:230px;flex:none;padding:6px 12px;background-color:var(--panel);border-right:1px solid var(--line);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row.ph .tl-lab{background-color:var(--panel2)}
.tl-track{position:relative;height:34px;flex:none}
.tl-bar{position:absolute;top:8px;height:18px;border-radius:4px;background:var(--muted)}
.tl-bar.phase{background:var(--ink);opacity:.75;top:11px;height:12px}
.tl-bar.doing{background:var(--blue)}.tl-bar.done{background:var(--green);opacity:.6}.tl-bar.late{background:var(--red)}
.tl-head{display:flex;border-bottom:2px solid var(--line);background:var(--panel)}
.tl-head .tl-lab{font-weight:600;color:var(--muted)}
.wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:12px;color:var(--muted);padding:8px 4px;white-space:nowrap}
.today{position:absolute;top:0;bottom:0;width:3px;background:var(--yellow);z-index:1;pointer-events:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* overview */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 18px}
.stat b{display:block;font:700 34px/1 var(--head)}
.stat span{color:var(--muted);font-size:14px}
.stat.bad b{color:var(--red)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--panel2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
td .bar{height:8px;min-width:80px}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--red-soft);color:var(--red)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.picker{display:flex;align-items:center;gap:10px;margin:12px 0 18px;flex-wrap:wrap}
.picker select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}

/* drawer & dialogs */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.15);z-index:20;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-h .x{margin-left:auto;background:none;border:0;font-size:26px;line-height:1;color:var(--muted)}
.drawer-b{padding:16px 18px;overflow:auto;display:grid;gap:14px}
.drawer-b h3{font-size:24px}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
label.f textarea{min-height:140px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:10px;padding:0;width:min(480px,94vw);background:var(--panel);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,26,32,.5)}
.dlg{padding:20px 22px;display:grid;gap:14px}
.dlg h3{font-size:24px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.team li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.team ul{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.team small{color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--red);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;font-weight:600;z-index:40;display:none}
.menu{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;height:auto}
  main{overflow:visible}
  aside{position:fixed;inset:0 20% 0 0;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  aside.open{transform:none;box-shadow:10px 0 30px rgba(0,0,0,.3)}
  .menu{display:inline-flex;margin:14px 16px 0}
  .top,.body{padding-left:16px;padding-right:16px}
  .banner{margin-left:16px;margin-right:16px}
  .top h2{font-size:25px}
  .tl-lab{width:140px}
}
/* home summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.tile span{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font:700 30px/1.15 var(--head);margin-top:6px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b.sm{font-size:21px;line-height:1.5}
.tile small{color:var(--muted);font-size:13px}
.tile.bad{background:var(--red-soft);border-color:var(--red)}
.tile.bad span,.tile.bad b{color:var(--red)}
/* one-line task table */
.ttable td{vertical-align:middle;padding:10px 14px}
.ttable th:first-child,.ttable td:first-child{width:44px;padding-right:0}
.ttable .phrow td{background:var(--panel2);cursor:default;padding:9px 14px}
.ttable .phrow:hover td{background:var(--panel2)}
.phrow h3{font-size:17px;display:inline}
.phrow .n{color:var(--muted);font-size:13px;margin-left:10px}
.phrow .n.ok{color:var(--green);font-weight:600}
.ttable .tn{font-weight:600}
.ttable .tn small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.ttable tr.done .tn{color:var(--muted)}
.ttable tr.na{opacity:.55}
.ttable .cbox{margin:0}
.dim{color:var(--muted)}
.mat{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.mat i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.mat.ready i{background:var(--yellow)}.mat.ordered i{background:var(--blue)}.mat.drop i{background:var(--green)}
.sched{white-space:nowrap;font-variant-numeric:tabular-nums}
.sched.late{color:var(--red);font-weight:600}
.ttable tr.subtr td{padding-top:5px;padding-bottom:5px;font-size:14px;border-bottom-color:transparent}
.ttable tr.subtr+tr:not(.subtr) td{border-top:1px solid var(--line)}
.ttable tr.subtr .tn{font-weight:500;padding-left:42px;position:relative}
.ttable tr.subtr .tn::before{content:"";position:absolute;left:24px;top:-6px;height:calc(50% + 6px);width:12px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:5px}
.ttable tr.subtr.done .tn{color:var(--muted)}
.subwrap{display:inline-flex;align-items:center;gap:10px}
.cbox.sm input{width:18px;height:18px;border-width:2px}
.cbox.sm input:checked::after{width:4px;height:8px;border-width:0 2px 2px 0}
.cbox.sm input:disabled{cursor:default}
.ttable .pf{min-height:28px}
.ttable .pf button{padding:2px 10px;font-size:13px}
.matbtn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 11px 3px 9px;font-size:14px;font-weight:600}
.matbtn:hover{background:var(--panel2);border-color:var(--muted)}
.matbtn i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.matbtn.none{color:var(--muted);font-weight:500;background:var(--panel2);border-color:var(--line)}
.matbtn.none i{background:var(--line)}
.matbtn.ready:not(.sch){border-color:var(--yellow);background:var(--yellow);color:#1D2733}.matbtn.ready:not(.sch) i{background:#1D2733}.matbtn.ready:not(.sch):hover{background:var(--yellow);filter:brightness(.95)}
.matbtn.ordered{border-color:var(--yellow);background:var(--yellow);color:#1D2733}.matbtn.ordered i{background:#1D2733}.matbtn.ordered:hover{background:var(--yellow);filter:brightness(.95)}
.matbtn.supplied,.matbtn.drop{border-color:var(--green)!important;background:var(--green)!important;color:#fff!important}.matbtn.supplied i,.matbtn.drop i{background:#fff!important}.matbtn.supplied:hover,.matbtn.drop:hover{background:var(--green);filter:brightness(.95)}
.subsupbtn{color:var(--green);border-color:var(--green)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .matbtn.supplied,:root:not([data-theme="light"]) .matbtn.drop{color:#0E1317!important}:root:not([data-theme="light"]) .matbtn.supplied i,:root:not([data-theme="light"]) .matbtn.drop i{background:#0E1317!important}}:root[data-theme="dark"] .matbtn.supplied,:root[data-theme="dark"] .matbtn.drop{color:#0E1317!important}:root[data-theme="dark"] .matbtn.supplied i,:root[data-theme="dark"] .matbtn.drop i{background:#0E1317!important}
.matbtn.drop{border-color:var(--green);background:var(--green-soft);color:var(--green)}.matbtn.drop i{background:var(--green)}
.schcell{display:grid;gap:3px;justify-items:start}
.schcell:has(.echip){display:flex;flex-wrap:nowrap;align-items:center;gap:8px}.schcell:has(.echip) small{white-space:nowrap}
.schcell small{font-size:12px;color:var(--muted)}
.schcell small.late{color:var(--red)}
.exps{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px;background:var(--panel)}
.exps input{border:0;background:none;padding:0;font-size:13px;color:var(--ink);min-width:0}
.exps.late{border:1px solid var(--red);background:var(--red-soft);color:var(--red)}
.exps.set{border-style:solid}
.matbtn.sch.scheduled{border-color:var(--blue);color:var(--blue)}.matbtn.sch.scheduled i{background:var(--blue)}
.matbtn.sch.completed{border-color:var(--green);background:var(--green-soft);color:var(--green)}.matbtn.sch.completed i{background:var(--green)}
/* home options in the new/edit home dialog */
.opts{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.opts>b{font-family:var(--head);font-size:18px}
.opts>small{color:var(--muted);font-size:13px;margin-top:-6px}
.opts fieldset{border:0;margin:0;padding:0;display:grid;gap:6px}
.opts legend{font-size:14px;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:8px 16px;font-weight:600;background:var(--panel)}
.seg input:checked+span{background:var(--yellow);border-color:var(--yellow);color:#1D2733}
.seg input:focus-visible+span{outline:3px solid var(--yellow);outline-offset:2px}
dialog{max-height:92vh;overflow:auto}
/* overview tab */
.ovgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.panel h3{font-size:17px;margin-bottom:10px}
.panel.warn{border-color:var(--red)}.panel.warn h3{color:var(--red)}
.panel p{margin:0}
.phline{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr 42px;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.phline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phline b{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.ovlist{list-style:none;margin:0;padding:0}
.ovlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ovlist li:last-child{border-bottom:0}
.ovlist li:hover span:first-child{text-decoration:underline}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.counts b{display:block;font:700 26px/1.1 var(--head);font-variant-numeric:tabular-nums}
.counts span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.d{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;display:inline-block}
.d.ready{background:var(--yellow)}.d.ordered{background:var(--blue)}.d.drop{background:var(--green)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.linkbtn.plain{color:var(--blue);margin-left:6px}
/* docs tab */
.docadd{display:grid;gap:8px;margin-bottom:14px;padding:12px}
.docrow{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}

.ai-card label{display:grid;gap:3px;font-weight:600;color:var(--muted);font-size:12px}

.ai-status{color:var(--ink);font-size:13px}.ai-status:empty{display:none}
.ai-acts .ai-sendbtn{margin-left:auto}
.ai-acts{display:flex;flex-wrap:wrap;gap:6px}.ai-acts .btn{font-size:13px;padding:6px 10px;text-decoration:none}

const EXTRA_LBL={drive:"concrete drive",fireplace:"fireplace",shrubs:"shrubs",sidewalk:"sidewalk",tileShower:"tile shower",tileFloor:"tile bathroom floors",tileBacksplash:"tile backsplash"};
function condLabel(c){if(!c)return"";const o=[];
  if(c.homeType&&!c.foundation)o.push(c.homeType==="mfg"?"Manufactured only":"Site-built only");
  if(c.foundation)o.push(c.foundation==="crawl"?"Crawl space only":"Slab only");

  if(c.porch)o.push([].concat(c.porch).includes("wood")?"Wood porch":"Concrete porch");
  if(c.extras)o.push("If "+[].concat(c.extras).map(x=>EXTRA_LBL[x]||x).join(" / "));

function tplAction(a){const[act,kind,key]=a.split("|");
  if(act==="up"||act==="down"){tplMove(kind,key,act==="up"?-1:1);return}
  if(act==="hide"){if(kind==="t"&&key in TPL.add){delete TPL.add[key];Object.keys(TPL.adds).forEach(k=>{if(TPL.adds[k].parent===key)delete TPL.adds[k]})}
    else if(kind==="s"&&key in TPL.adds)delete TPL.adds[key];else (kind==="t"?tRec:sRec)(key).hide=true;tplSave();return}
  if(act==="restore"){delete (kind==="t"?tRec:sRec)(key).hide;tplSave();return}
  if(act==="addtask"){const k=kind+"-t"+uid();TPL.add[k]={phase:kind,name:"New task",days:0,ord:9999};tplSave();setTimeout(()=>{const el=document.getElementById("tp-n-"+k);if(el){el.focus();el.select()}},30);return}
  if(act==="addsub"){const k=key+"--s"+uid();TPL.adds[k]={parent:key,name:"New sub-task",ord:9999};tplSave();setTimeout(()=>{const el=document.getElementById("tp-n-"+k);if(el){el.focus();el.select()}},30);return}
  if(act==="ptadd"){TPL.pipeTodos.push("New to-do");tplSave();setTimeout(()=>{const el=document.getElementById("tp-pt"+(TPL.pipeTodos.length-1));if(el){el.focus();el.select()}},30);return}
  if(act==="ptdel"){TPL.pipeTodos.splice(+kind,1);tplSave();return}}
function tplInput(el){
  if(el.dataset.tpd==="pre"){const v=Math.max(1,Math.min(90,Math.round(+el.value||0)));if(v){TPL.preDays=v;tplSave()}return}
  if(el.dataset.tpd){const v=Math.max(1,Math.min(999,+el.value||0));if(v){TPL.days=v;tplSave()}return}
  if(el.dataset.tppt!==undefined){const v=el.value.trim();if(!v){render();return}TPL.pipeTodos[+el.dataset.tppt]=v;tplSave();return}
  const[kind,key,f]=el.dataset.tp.split("|"),rec=(kind==="t"?tRec:sRec)(key);
  if(f==="name"){const v=el.value.trim();if(!v){toast("A task needs a name, so it was kept as before");render();return}rec.name=v}
  else if(f==="days")rec.days=Math.max(0,Math.min(365,Math.round(+el.value||0)));
  else if(f==="mat")rec.noMat=!el.checked;
  tplSave()}

/* ===== Task logic ===== */
function phaseItems(job,p){
  const custom=Object.entries(job.custom||{}).filter(([k,c])=>c&&c.phase===p.id).sort((a,b)=>a[1].order-b[1].order)
    .map(([k,c])=>({key:k,name:c.name,f:DAT,phase:p.id,subs:[],custom:true}));
  return p.items.filter(t=>applies(job,t)).map(t=>t.subs.some(s=>s.cond)?{...t,subs:t.subs.filter(s=>applies(job,s))}:t).concat(custom);
}
function phaseOn(job,p){return!p.home||(optVal(job,"homeType")||"site")===p.home}
function phasesFor(job){return schedFor(job.tpl).filter(p=>phaseOn(job,p))}
function allItems(job){return phasesFor(job).flatMap(p=>phaseItems(job,p))}
const S=(job,key)=>(job.state||{})[key]||{};
function subDone(job,s){const x=S(job,s.key);return s.f.includes("pf")?x.pf==="pass":!!x.done}
function isNA(job,t){return !!S(job,t.key).na}
function isDone(job,t){const x=S(job,t.key);return !!(x.na||x.done)}

function parentOf(job,key){return allItems(job).find(t=>t.subs.some(s=>s.key===key))}
function isLate(job,t){const x=S(job,t.key);return !isDone(job,t)&&!!x.end&&x.end<TODAY}
function touched(job,t){const has=x=>Object.entries(x).some(([k,v])=>k!=="assignee"&&k!=="notes"&&v);return has(S(job,t.key))||t.subs.some(s=>has(S(job,s.key)))}
function status(job,t){if(isNA(job,t))return"na";if(isDone(job,t))return"done";if(isLate(job,t))return"late";return touched(job,t)?"doing":"todo"}
function stats(job){const it=allItems(job).filter(t=>!isNA(job,t));const d=it.filter(t=>isDone(job,t)).length;
  return{total:it.length,done:d,pct:it.length?Math.round(100*d/it.length):0,late:it.filter(t=>isLate(job,t)).length,next:it.find(t=>!isDone(job,t))}}
function phaseOf(key){return SCHEDULE.find(p=>key.startsWith(p.id+"-"))||SCHEDULE[0]}

function report(e){console.error(e);toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete finished homes to make room.":"That change didn't save. Try again.")}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])){a[k]=merge(a[k]&&typeof a[k]==="object"?a[k]:{},b[k])}else a[k]=b[k]}return a}
const store={
  async addJob(d){if(db){const r=await db.collection("jobs").add(d);return r.id}const id=uid();jobs.push({id,...d});render();return id},
  async patch(id,p){
    // start the due-date clock the first time Install Footers is marked done (or its schedule set to Completed)
    const job=jobs.find(j=>j.id===id),sw=p.state&&Object.entries(p.state).some(([k,x])=>k.startsWith("p2-")&&x&&(x.done===true||x.pf==="pass"));
    if(sw&&job&&!job.footerDate&&!("footerDate" in p)){p={...p,footerDate:TODAY};setTimeout(()=>toast("Site work started today. That's day 0: the countdown has started."),2700)}
    if(p.state){let st=null;for(const k in p.state){const x=p.state[k];if(x&&"done" in x&&!("doneOn" in x)){st=st||{...p.state};st[k]={...x,doneOn:x.done?TODAY:""}}}if(st)p={...p,state:st}}
    if(db)return db.doc("jobs/"+id).update(p);merge(jobs.find(j=>j.id===id),p);render()},
  async delJob(id){if(db)return db.doc("jobs/"+id).delete();jobs=jobs.filter(j=>j.id!==id);render()},
  async setTeam(m){if(db)return db.doc("config/team").set({members:m});team=m;render()}
};
function setField(jobId,key,f,v){store.patch(jobId,{state:{[key]:{[f]:v}}}).catch(report)}
// changing a sub-task: if it's no longer done, the main task can't stay completed
function setSub(job,key,f,v){
  const st={[key]:{[f]:v}},par=parentOf(job,key);
  const nowDone=f==="pf"?v==="pass":(f==="done"?!!v:null);
  if(par&&nowDone===false&&S(job,par.key).done){st[par.key]={done:false};toast(par.name+" un-checked as completed")}
  // last sub-task finished on a task whose schedule is already Completed: mark the task done
  if(par&&nowDone===true&&(S(job,par.key).sched==="completed"||OPS_TASKS.has(par.key))&&!S(job,par.key).done&&par.subs.every(s=>s.key===key||subDone(job,s))){st[par.key]={done:true};toast(par.name+" done")}
  store.patch(job.id,{state:st}).then(()=>{
    const sub=par&&par.subs.find(s=>s.key===key),pid=sub&&nowDone===true&&permitFor(sub.name);
    if(pid&&assetsApi)askPermitCopy(job.id,pid);
  }).catch(report);
}

/* Touch screens (iPad especially): the date picker is attached to its input, and iOS fills in and "changes" the date the
   moment the picker opens. Saving then re-drawing the page replaced the input and closed the picker before a day could be
   tapped. So while a date picker is open on a touch device, saves and re-draws wait until it closes. */
const TOUCH=(navigator.maxTouchPoints||0)>0||matchMedia("(any-pointer:coarse)").matches;

document.addEventListener("focusout",e=>{const t=e.target;if(!(t&&t.tagName==="INPUT"&&t.type==="date"))return;
  setTimeout(()=>{if(t.__dirty){t.__dirty=false;t.__replay=true;t.dispatchEvent(new Event("change",{bubbles:true}));t.__replay=false}
    if(renderHeld&&!datePickerOpen()){renderHeld=false;render()}},0)},true);

  $("main").scrollTop=sc;{const t2=$(".todobox");if(t2)t2.scrollTop=tsc}

}

/* ===== Home status: On Track / At Risk / Behind Schedule =====
   Set by hand from the menu at the top right, or left on Automatic, which works it out:
   Behind = any task past its end date, or the home is past its due date.
   At risk = a failed inspection on an open task, due within 14 days and under 90% done,
             or the calendar is running more than 15 points ahead of progress. */
const STATUSES=[["track","On Track"],["risk","At Risk"],["behind","Behind Schedule"]];
function autoStatus(j){
  const s=stats(j),h=homeDue(j);
  if(h.due&&h.due<TODAY)return"behind";
  if(preLate(j))return"risk";
  if(allItems(j).some(t=>!isNA(j,t)&&!isDone(j,t)&&failed(j,t)))return"risk";
  if(h.due&&diff(TODAY,h.due)<=14&&s.pct<90)return"risk";
  if(h.started&&h.days&&j.footerDate){const used=diff(j.footerDate,TODAY)/h.days;if(used*100-s.pct>15)return"risk"}
  return"track";
}
function homeStatus(j){const m=j.status;return STATUSES.some(x=>x[0]===m)?{v:m,auto:false}:{v:autoStatus(j),auto:true}}
const statusName=v=>(STATUSES.find(x=>x[0]===v)||[,""])[1];

function lightsHTML(j){const v=homeStatus(j).v;return`<span class="sdot s-${v}" role="img" aria-label="${statusName(v)}" title="${statusName(v)}"></span>`}
function statusBadge(j){const st=homeStatus(j);return`<span class="hstat ${st.v}">${statusName(st.v)}</span>`}
function dueChip(j){const u=dueSummary(j);

function statusDisplay(j){const st=homeStatus(j);
  return`<span class="hstatpick ${st.v}" title="${st.auto?"Worked out automatically from the schedule":"Set by hand in Edit home"}"><i></i><span class="hstxt">${statusName(st.v)}</span>${st.auto?"":`<small class="hsman">Manual</small>`}</span>`}

/* ===== One-line task table ===== */

// Material toggle: grey "Ready to order" (not requested) -> yellow Ready to order (sent to operations) -> Ordered -> On site -> back to grey
// tasks that never need materials ordered: no Ready to order pill
const MAT_STEPS=[["","Ready to order"],["ready","Ready to order"],["ordered","Ordered"],["drop","On site"],["supplied","Supplied"]];   // 4 = the sub brings the material
// the task list's Material column shows the short form so the Task column gets the room
const pillShort=l=>l.replace(/^Ready to /,"To ").replace(/^Inspection scheduled$/,"Scheduled");
function matStage(x){return x.subsup?4:x.drop?3:x.ordered?2:x.ready?1:0}
function matBtn(j,t){
  const i=matStage(S(j,t.key)),[c,l]=MAT_STEPS[i],tip=["Tap to send to operations to order","Tap when ordered","Tap when it's on site","Tap to clear","Sub-supplied. Tap to clear"][i];
  return`<button type="button" class="matbtn ${c||"none"}" data-mat="${j.id}|${t.key}" title="${tip}" aria-label="Material for ${esc(t.name)}: ${i?l:"not requested"}. ${tip}"><i></i>${pillShort(l)}</button>`;
}
/* two dates side by side in the pop-up */
function cycleMat(ref){
  const[jid,key]=ref.split("|"),j=jobs.find(x=>x.id===jid);if(!j)return;
  const st=matStage(S(j,key));setMat(jid,key,st===4?0:(st+1)%4);
}
function setMat(jid,key,n){
  const j=jobs.find(x=>x.id===jid);if(!j)return;const was=matStage(S(j,key));
  const p={ready:n>=1&&n<4,ordered:n>=2&&n<4,drop:n===3,subsup:n===4};if(n===4)p.subsupOn=TODAY;
  if(n>=1&&was<1)p.readyOn=TODAY;
  if(n===3&&was<3)p.dropOn=TODAY;
  store.patch(jid,{state:{[key]:p}}).then(()=>{
    if(n===2&&was<2)askNote(jid,key,"Ordered","e.g. 84 Lumber, order #4471",[{f:"orderDate",label:"Date ordered",def:TODAY},{f:"delivDate",label:"Estimated delivery"}],{label:"Sub-supplied",tip:"The sub brings this material, so nothing to order",run:()=>setMat(jid,key,4)});
    if(n===3&&was<3)askNote(jid,key,"On site","e.g. Dropped at the back of the lot");
  }).catch(report);
}
// Schedule toggle: grey "Scheduled" (not yet) -> Scheduled -> Completed -> back to grey. Ops scheduling requests come from inspections.
function schStage(x){return x.sched==="completed"?2:x.sched==="scheduled"?1:0}
// inspections: grey "Ready to schedule" -> yellow Ready to schedule (sent to operations) -> Inspection scheduled -> back to grey
const INSP_STEPS=[["none","Ready to schedule"],["ready","Ready to schedule"],["scheduled","Inspection scheduled"]];
function inspStage(x){return x.isched==="req"?1:x.isched?2:0}
function inspBtn(j,s){const i=inspStage(S(j,s.key)),[c,l]=INSP_STEPS[i];
  return`<button type="button" class="matbtn sch ${c}" data-isched="${j.id}|${s.key}" title="${["Tap to send to operations to schedule","Tap when the inspection is scheduled","Tap to clear"][i]}" aria-label="${esc(s.name)}: ${i===0?"not requested":l}"><i></i>${pillShort(l)}</button>`}
function cycleInsp(ref){
  const[jid,key]=ref.split("|"),j=jobs.find(x=>x.id===jid);if(!j)return;
  const n=(inspStage(S(j,key))+1)%3,v=["","req","sched"][n];
  const p={isched:v};if(n===1)p.ireqOn=TODAY;
  store.patch(jid,{state:{[key]:p}}).then(()=>{if(n===2)askNote(jid,key,"Inspection scheduled","e.g. Morning window, call Jim",{f:"schedDate",label:"Inspection date"})}).catch(report);
}
// latest note on a task, shown under its name
// projected dates shown under the Material / Schedule / inspection buttons
function dateLine(x,f,label,doneFlag){const v=x[f];if(!v)return"";const late=!doneFlag&&v<TODAY;
  return`<small class="sched ${late?"late":""}">${label} ${fmt(v)}${late?" (past)":""}</small>`}
function noteLine(x){const n=x.lastNote;if(!n||!n.txt)return"";
  return`<small class="lastnote" title="${esc((n.by?n.by+", ":"")+fmt(n.on))}">${esc(n.what)}: ${esc(n.txt)}</small>`}

function taskPct(j,t){
  if(isDone(j,t))return 100;
  if(t.subs.length)return Math.round(100*t.subs.filter(s=>subDone(j,s)).length/t.subs.length);
  const x=S(j,t.key);
  if(x.sched==="completed")return 90;
  if(x.drop||x.subsup)return 75;if(x.ordered)return 50;if(x.ready)return 25;
  if(x.start&&x.end&&x.start<=TODAY){const tot=diff(x.start,x.end)+1;return Math.min(95,Math.round(100*(diff(x.start,TODAY)+1)/tot))}
  return 0;
}
function dueCell(j,t){
  const x=S(j,t.key);
  if(isDone(j,t)||!x.end)return`<span class="dim">—</span>`;
  const d=diff(TODAY,x.end);
  if(d<0)return`<span class="due late">${-d} day${d===-1?"":"s"} late</span>`;
  if(d===0)return`<span class="due soon">Due today</span>`;
  return`<span class="due ${d<=3?"soon":""}">${d} day${d===1?"":"s"}</span>`;
}
function failed(j,t){return S(j,t.key).pf==="fail"||t.subs.some(s=>S(j,s.key).pf==="fail")}
function statusPill(j,t,st){
  if(st!=="done"&&st!=="na"&&failed(j,t))return`<span class="st fail">Failed inspection</span>`;
  if(st==="todo")return"";
  return`<span class="st ${st}">${{done:"Done",doing:"In progress",late:"Late",todo:"Not started",na:"N/A"}[st]}</span>`;
}
// small note icon beside a task that has a note; hover shows the latest one
function noteIcon(x){
  const ln=x.lastNote&&x.lastNote.txt?x.lastNote:null,n=x.notes||"";if(!n&&!ln)return"";
  const latest=(x.notesAt||0)>=(ln&&(ln.at||Date.parse(ln.on||"")||0)||0)&&n?n:ln?(ln.what?ln.what+": ":"")+ln.txt:n;
  return`<span class="nicon" role="img" aria-label="Has a note: ${esc(latest)}" title="${esc(latest)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8.5 12h7M8.5 16h5"/></svg></span>`}
// tap the date to change it; blank shows "Set date"
const CAL=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`;
// calendar chip: "Est. Start" / "Est. Complete" until a date is picked, then the date
// start is late when the date has passed and nothing has happened on the task yet
function startLate(j,t){const x=S(j,t.key),v=x.expStart||x.start;return !!v&&v<TODAY&&!isDone(j,t)&&taskPct(j,t)===0}
function estDate(j,t,f,late){const v=S(j,t.key)[f]||"",lab=f==="end"?"Est. Complete":"Est. Start";
  return`<label class="echip ${v?"set":""} ${late?"late":""}" title="${lab}">${CAL}<span>${v?fmt(v):lab}</span><input type="date" data-j="${j.id}" data-k="${t.key}" data-f="${f}" value="${esc(v)}" aria-label="${lab} for ${esc(t.name)}"></label>`}
function rowHTML(j,t){
  const st=status(j,t),x=S(j,t.key),late=st==="late";
  const bits=[];
  if(t.subs.length)bits.push(t.subs.filter(s=>subDone(j,s)).length+" of "+t.subs.length+" sub-tasks");

function permitLabel(j,id){const sw=optVal(j,"sewer");return id==="sewer"&&sw?(sw==="septic"?"Septic":"Sewer"):(PERMITS.find(p=>p[0]===id)||[,id])[1]}
let permitFor_=null;
function askPermitCopy(jid,pid){
  const j=jobs.find(x=>x.id===jid);if(!j||!assetsApi)return;
  let dlg=document.getElementById("permitDlg");
  if(!dlg){dlg=document.createElement("dialog");dlg.id="permitDlg";document.body.appendChild(dlg);
    dlg.addEventListener("click",e=>{if(e.target.dataset.act==="pskip"){permitFor_=null;dlg.close()}});

    dlg.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("[data-pdrop]");if(z){e.preventDefault();z.classList.add("over")}});
    dlg.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("[data-pdrop]");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over")});
    dlg.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("[data-pdrop]");if(!z)return;e.preventDefault();z.classList.remove("over");const fl=e.dataTransfer&&e.dataTransfer.files[0];if(fl)uploadPermit(fl)});
    dlg.addEventListener("cancel",()=>{permitFor_=null})}
  permitFor_={jid,pid};const label=permitLabel(j,pid);
  dlg.innerHTML=`<div class="dlg"><span class="dim small">${esc(j.name)}</span><h3>Add a copy of the ${esc(label.toLowerCase())} permit?</h3>
   <div class="dropzone" data-pdrop="1"><b>Drop the permit here</b><span>or <label class="linkbtn plain filepick">choose a file<input type="file" id="permitFile" class="vh" accept="${DOC_TYPES.join(",")}"></label></span><small>PDF or photo, up to 20 MB. It's saved under Docs → Permits and linked in the Permits box.</small></div>
   <p id="permitMsg" class="dim small" aria-live="polite" style="margin:0"></p>
   <div class="acts"><button type="button" class="btn" data-act="pskip">Not now</button></div></div>`;

async function uploadPermit(file){
  if(!permitFor_||!assetsApi)return;const{jid,pid}=permitFor_,j=jobs.find(x=>x.id===jid),msg=document.getElementById("permitMsg");
  const type=guessType(file);
  if(!DOC_TYPES.includes(type)){if(msg)msg.textContent="That file isn't a PDF or photo. Try another, or add it later from the Docs tab.";return}
  if(msg)msg.textContent="Uploading…";
  try{
    const r=await assetsApi.upload(file,{type}),did="d-"+uid(),label=permitLabel(j,pid)+" permit";
    await store.patch(jid,{docs:{[did]:{name:label,cat:"Permits",asset:r.id,type:r.contentType,size:r.sizeBytes,added:TODAY,order:Date.now(),permit:pid}},
      permits:{[pid]:{doc:did,...(permitStage(j,pid)<1?{stage:1,on:{1:TODAY}}:{})}}});
    permitFor_=null;document.getElementById("permitDlg").close();toast(label+" saved to Docs");
  }catch(e){console.error(e);if(msg)msg.textContent={too_large:"That file is over 20 MB.",unsupported_type:"Only PDFs and photos can be uploaded.",quota_or_state:"Storage is full. Remove old documents to make room.",not_granted:"Uploading needs edit access to this page."}[e&&e.code]||"Upload didn't go through. Try again."}
}

/* ===== Orders: every material order on the home, same state as the task list's Material buttons ===== */
// Orders: a running list. Deliveries older than ORDERS_KEEP days sit above the visible area (scroll up to see them),
// so the first visible line is what's next: recent deliveries, then ordered by ETA, then requested, then not ordered in schedule order.
const ORDERS_KEEP=3;
function ordersHTML(j){
  const items=allItems(j).filter(t=>!isNA(j,t)&&!OPS_TASKS.has(t.key)&&(t.f.includes("ready")||matStage(S(j,t.key))>0)).map((t,i)=>({t,x:S(j,t.key),i}));
  const old=[],recent=[],ordered=[],none=[];
  for(const it of items){const st=matStage(it.x);
    if(st===4)old.push(it);else if(st===3)((it.x.dropOn&&diff(it.x.dropOn,TODAY)<ORDERS_KEEP)?recent:old).push(it);else if(st===2)ordered.push(it);else none.push(it)}
  old.sort((a,b)=>(a.x.dropOn||"")<(b.x.dropOn||"")?-1:1);recent.sort((a,b)=>(a.x.dropOn||"")<(b.x.dropOn||"")?-1:1);
  ordered.sort((a,b)=>(a.x.delivDate||"9")<(b.x.delivDate||"9")?-1:1);none.sort((a,b)=>(matStage(b.x)-matStage(a.x))||a.i-b.i);   // requested before not ordered
  const status=x=>{const st=matStage(x);
    if(st===4)return`<span class="ostat onsite">Sub-supplied</span>`;
    if(st===3)return`<span class="ostat onsite">On site${x.dropOn?" · "+fmt(x.dropOn):""}</span>`;
    if(st===2){const late=x.delivDate&&x.delivDate<TODAY;return`<span class="ostat ordered ${late?"late":""}">Ordered${x.delivDate?` · ETA ${fmt(x.delivDate)}`:" · no ETA"}</span>`}
    if(st===1)return`<span class="ostat req">Requested</span>`;
    return`<span class="ostat none">Not ordered</span>`};
  const li=(it,cls="")=>`<li class="${cls}"><button type="button" class="oname" data-open="${j.id}|${it.t.key}">${esc(it.t.name)}</button>${status(it.x)}</li>`;
  const all=[...old.map(it=>li(it,"oold")),...recent.map((it,k)=>li(it,k===0?"onext":"")),...ordered.map((it,k)=>li(it,!recent.length&&k===0?"onext":"")),...none.map((it,k)=>li(it,!recent.length&&!ordered.length&&k===0?"onext":""))];
  return`<section class="panel orders"><div class="bhead"><h3>Orders</h3>${old.length?`<span class="dim small">${old.length} delivered earlier, scroll up</span>`:""}</div>
   ${items.length?`<ul class="ostlist" data-autoscroll="1">${all.join("")}</ul>`:`<p class="dim">No material orders on this home yet.</p>`}
  </section>`;
}

/* ===== Permits: where each permit is in the process ===== */
const PERMITS=[["building","Building"],["sewer","Septic / Sewer"],["electrical","Electrical"],["plumbing","Plumbing"],["hvac","HVAC"],["gas","Gas"]];
// Permits: one line each, name on the left, one status on the right. Tap the status to move it along:
// Not applied -> Applied -> Rough-in passed -> Final pulled -> Final passed -> back. Fixed order; passed ones are dimmed.
// "Applied" also comes straight from the Pre-Build checklist (Apply for building permit, Apply for septic permit, Pay Sewer Tap).
const PERMIT_APPLY={building:["p1-pre-build--apply-for-building-permit"],sewer:["p1-pre-build--apply-for-septic-permit","p1-pre-build--pay-sewer-tap"]};
function permitApplied(j,id){return(PERMIT_APPLY[id]||[]).some(k=>S(j,k).done)}
// rough-in inspections moved to their own Inspections panel, so trade permits go straight from Applied to Final pulled
const PERMIT_STEPS=["Not applied","Applied","Final pulled","Final passed"];
// the building permit is the initial permit: it's closed out when the CO is issued
const BUILDING_STEPS=["Not applied","Applied","Pulled","CO received"];
// septic / sewer: the permit is pulled, then passed (septic by the state) - no rough-in or final-pulled steps
const SEPTIC_STEPS=["Not applied","Applied","Pulled","State passed"],SEWER_STEPS=["Not applied","Applied","Pulled","Passed"];
const stepsFor=(id,j)=>id==="building"?BUILDING_STEPS:id==="sewer"?(j&&optVal(j,"sewer")==="sewer"?SEWER_STEPS:SEPTIC_STEPS):PERMIT_STEPS;
// saved as {stage, on:{1:date,...}}; older saves used applied / pulled / final flags
const oldTrade=(p,id)=>stepsFor(id)===PERMIT_STEPS&&p.stage!==undefined&&p.sv!==2;
function permitSaved(p,id){const last=stepsFor(id).length-1;if(oldTrade(p,id)){const o=+p.stage;return Math.min(o>=2?o-1:o,last)}return p.stage!==undefined?Math.min(+p.stage,last):p.final?last:(p.pulled||p.applied)?1:0}
// inspections on the Tasks tab move the permit along (one way: the permit can also be set by hand, never lower than its inspections)
// rough: a rough-in inspection passed -> Rough-in passed. final: a final inspection requested/scheduled -> Final pulled; passed -> Final passed.
const PERMIT_LINKS={
  building:{final:["p5-certificate-of-occupancy","p5-certificate-of-occupancy--inspection"]},
  sewer:{final:["m4-connect-septic--inspection","m4-connect-sewer--inspection"]},
  electrical:{rough:["p3-electrical-rough-in--inspection"],final:["p4-electrical-state-final","m4-connect-electric--inspection"]},
  plumbing:{rough:["p3-plumbing-rough-in--inspection"]},
  hvac:{rough:["p3-hvac-rough-in--inspection"],final:["p4-hvac-state-final","p4-hvac-state-final--inspection","m4-install-hvac--inspection"]}
};
function permitFromTasks(j,id){
  const L=PERMIT_LINKS[id]||{},last=stepsFor(id).length-1,keys=new Set(allItems(j).flatMap(t=>[t.key,...t.subs.map(s=>s.key)]));let st=permitApplied(j,id)?1:0;
  if(id==="sewer"&&manualSt(j,"sewer")===2)st=Math.max(st,last);
  for(const k of L.final||[]){if(!keys.has(k))continue;const x=S(j,k),sub=k.includes("--");
    if(x.pf==="pass"||(!sub&&x.done))st=Math.max(st,last);
    else if(stepsFor(id)===PERMIT_STEPS&&(x.isched||(!sub&&(x.ordered||schStage(x)>=1))))st=Math.max(st,last-1)}
  return st;
}
function permitStage(j,id){const p=(j.permits||{})[id]||{};return Math.max(permitSaved(p,id),permitFromTasks(j,id))}
function permitDate(p,st,last){if(p.sv!==2&&last===PERMIT_STEPS.length-1&&p.stage!==undefined&&st>=2)st=st+1;return(p.on||{})[st]||(st===1?p.appliedOn||p.pulledOn:st===last?p.finalOn:"")||""}
function permitsHTML(j){
  const P=j.permits||{},sw=optVal(j,"sewer");
  return`<section class="panel"><h3>Permits</h3><ul class="ostlist plist2">${PERMITS.filter(([id])=>id!=="gas"||!allItems(j).some(t=>/gas-rough-in$/.test(t.key)&&isNA(j,t))).map(([id,l])=>{
    const p=P[id]||{},st=permitStage(j,id),name=id==="sewer"&&sw?(sw==="septic"?"Septic":"Sewer"):l,doc=p.doc&&(j.docs||{})[p.doc];
    const extra=[id==="building"&&j.permit?"#"+esc(j.permit):"",doc?`<a class="plink" href="${esc(docHref(doc))}" target="_blank" rel="noopener">View permit</a>`:assetsApi?`<button type="button" class="linkbtn plain plink" data-paddcopy="${id}">Add copy</button>`:""].filter(Boolean).join(" · ");
    const steps=stepsFor(id,j),last=steps.length-1,dd=permitDate(p,st,last),label=steps[st]+(st&&dd?" · "+fmt(dd):"");
    const cls=st===0?"s0":st===last?"s4":st===1?"s1":"s2";
    return`<li class="${st===last?"pdone":""}"><span class="pnm"><b>${esc(name)}</b>${extra?` <small class="dim">${extra}</small>`:""}</span>
      <button type="button" class="pstat ${cls}" data-pcycle="${id}" title="${st<last?"Tap to mark "+steps[st+1].toLowerCase():"Tap to clear"}">${label}</button></li>`}).join("")}</ul></section>`;
}
/* ===== Inspections: rough-in and other inspections on this home, read from the task list ===== */
// Fixed order: footers, (under-slab), septic/sewer, HVAC, plumbing, electrical, (gas), framing, final.
const INSP_ORDER=["footers","underslab","sewer","hvac","plumbing","electrical","gas","framing","other","statefinal","final"];
const MANUAL_INSP=["Not scheduled","Scheduled","Passed"];
function inspCat(key){return /state-final/.test(key)?"statefinal":/-framing$/.test(key)?"framing":/install-footers/.test(key)?"footers":/under-slab/.test(key)?"underslab":/septic|sewer/.test(key)?"sewer":/hvac/.test(key)?"hvac":/plumbing/.test(key)?"plumbing":/electric/.test(key)?"electrical":/gas/.test(key)?"gas":"other"}
// manual rows are stored as insx.<id> = {st:0|1|2, on}; framing falls back to an old framing permit that had reached Rough-in passed
function manualSt(j,id){const fi=(j.insx||{})[id];if(fi)return+fi.st||0;const fp=(j.permits||{})[id]||{};return id==="framing"&&fp.stage!==undefined&&fp.sv!==2&&+fp.stage>=2?2:0}
function inspRows(j){
  const out=[],site=optVal(j,"homeType")!=="mfg",sw=optVal(j,"sewer");
  for(const t of allItems(j)){if(isNA(j,t))continue;
    if(t.f&&t.f.includes("pf")&&/rough/i.test(t.name))out.push({cat:inspCat(t.key),t,key:t.key,name:t.name});
    for(const s of t.subs||[])if(s.f&&s.f.includes("pf")&&t.key!=="p5-certificate-of-occupancy")out.push({cat:inspCat(t.key),t,key:s.key,name:/^(call in )?inspection$/i.test(s.name)?t.name.replace(/^(Install|Connect) /,"").replace(/^Electric$/,"Electrical"):t.name+" · "+s.name})}
  if(!out.some(r=>r.cat==="sewer"))out.push({cat:"sewer",manual:"sewer",name:sw==="sewer"?"Sewer":"Septic"});
  if(site&&!out.some(r=>r.cat==="framing"))out.push({cat:"framing",manual:"framing",name:"Framing"});
  const co=allItems(j).find(t=>t.key==="p5-certificate-of-occupancy");
  out.push(co?{cat:"final",co,name:"Final"}:{cat:"final",manual:"final",name:"Final"});
  return out.map((r,i)=>({...r,i})).sort((a,b)=>INSP_ORDER.indexOf(a.cat)-INSP_ORDER.indexOf(b.cat)||a.i-b.i);
}
function inspectionsHTML(j){

    if(r.manual){const st=manualSt(j,r.manual),d=((j.insx||{})[r.manual]||{}).on||"";done=st===2;

    else{const x=S(j,r.key);done=x.pf==="pass"||(r.cat==="framing"&&!x.pf&&manualSt(j,"framing")===2);
      if(done){lab="Passed"+(x.doneOn?" · "+fmt(x.doneOn):"");cls="s4"}
      else if(x.pf==="fail"){lab="Failed";cls="sbad"}
      else if(x.isched&&x.isched!=="req"){lab="Scheduled"+(x.schedDate?" · "+fmt(x.schedDate):"");cls=x.schedDate&&x.schedDate<TODAY?"sbad":"s2"}
      else if(x.isched==="req"){lab="Sent to ops";cls="s1"}
      else{lab="Not scheduled";cls="s0"}
      btn=`data-open="${j.id}|${r.t.key}" title="Open ${esc(r.t.name)}"`}
    return`<li class="${done?"pdone":""}"><span class="pnm"><b>${esc(r.name)}</b></span><button type="button" class="pstat ${cls}" ${btn}>${esc(lab)}</button></li>`});
  return`<section class="panel inspanel"><h3>Inspections</h3><ul class="ostlist plist2">${rows.join("")}</ul></section>`;
}
function cycleInspX(id){

function cyclePermit(id){

/* ===== Needs you today: only what needs action now, most urgent first ===== */
const SOON_DAYS=2;   // inspections / start dates this many days out count as "today"
function whenTxt(d){const n=diff(TODAY,d);return n<0?`${-n} day${n===-1?"":"s"} overdue`:n===0?"today":n===1?"tomorrow":"in "+n+" days"}
function needsToday(j){
  const out=[];const add=(rank,kind,label,detail,open,extra={})=>out.push({rank,kind,label,detail,open,j,...extra});
  for(const t of allItems(j)){
    if(isNA(j,t)||OPS_TASKS.has(t.key))continue;const x=S(j,t.key),open=!isDone(j,t),ref=j.id+"|"+t.key;if(!open)continue;
    if(isLate(j,t))add(0,"late","Late",`${t.name} · ${diff(x.end,TODAY)} day${diff(x.end,TODAY)===1?"":"s"} past end date`,ref);
    if(failed(j,t))add(0,"fail","Failed inspection",t.name,ref);
    if(matStage(x)===2&&x.delivDate&&diff(TODAY,x.delivDate)<=1)add(x.delivDate<TODAY?0:1,"deliv",x.delivDate<TODAY?"Delivery overdue":"Delivery",`${t.name} · ${whenTxt(x.delivDate)}`,ref);
    if(SUBBED.has(t.key)&&x.expStart&&schStage(x)===0&&diff(TODAY,x.expStart)<=SOON_DAYS)add(x.expStart<TODAY?0:1,"start",x.expStart<TODAY?"Sub start passed":"Sub starting soon",`${t.name} · expected to start ${whenTxt(x.expStart)}`,ref);
    if(schStage(x)===1&&x.schedDate&&diff(TODAY,x.schedDate)<=1&&diff(TODAY,x.schedDate)>=0)add(1,"start","Starts",`${t.name} · ${whenTxt(x.schedDate)}`,ref);
    for(const s of t.subs){const y=S(j,s.key);if(s.f.includes("pf")&&inspStage(y)===2&&y.pf!=="pass"&&y.pf!=="fail"&&y.schedDate&&diff(TODAY,y.schedDate)<=SOON_DAYS)
      add(y.schedDate<TODAY?0:1,"insp","Inspection",`${t.name} · ${whenTxt(y.schedDate)}${y.schedDate<TODAY?", no result yet":""}`,ref)}
  }
  for(const[id,td]of todoList(j))if(!td.done&&td.due&&td.due<=TODAY)add(td.due<TODAY?0:1,"todo",td.due<TODAY?"Overdue to-do":"To-do",`${td.text} · ${whenTxt(td.due)}`,"",{todo:true});
  return out.sort((a,b)=>a.rank-b.rank);
}
function todayHTML(list,showHome){

async function ccSave(){

  for(const x of d.people){const v={name:x.name.trim(),role:x.role.trim(),phone:x.phone.trim(),email:x.email.trim()};if(!v.name&&!v.phone&&!v.email)continue;const pid=x.pid||"p"+uid();keep.add(pid);people[pid]={...v,order:++k}}
  for(const pid of Object.keys(old.people||{}))if(!keep.has(pid))people[pid]=null;
  if(!d.company.trim()&&!Object.values(people).some(v=>v&&v.name)){toast("Enter a company or a person's name");return}
  const seen=new Set(),role=d.role.split(/[,;]+/).map(x=>x.trim()).filter(x=>x&&!seen.has(x.toLowerCase())&&seen.add(x.toLowerCase())).join(", ");

  ccDraft=null;try{await contactStore.update(d.id,patch);
    const ar=allAreas().find(a=>normArea(a.name)===normArea(patch.area));
    if(ar&&patch.area&&normArea(patch.area)!==normArea(old.area)&&!acLinked(ar.id).has(d.id))await acAttach(ar.id,d.id);else toast("Saved")}catch(e){report(e)}ccPaint();
}

function timelineHTML(j){
  const rows=[];let min=null,max=null;
  const span=(s,e)=>{s=s||e;e=e||s;if(e<s)e=s;if(!min||s<min)min=s;if(!max||e>max)max=e;return[s,e]};
  phasesFor(j).forEach(p=>{const pd=S(j,"phase-"+p.id);const list=[];
    phaseItems(j,p).forEach(t=>{const x=S(j,t.key),st=x.start||x.expStart;if((st||x.end)&&!x.na)list.push({t,r:span(st,x.end),cls:status(j,t)})});
    const pr=(pd.start||pd.end)?span(pd.start,pd.end):null;
    if(pr||list.length)rows.push({p,pr,list})});
  if(!rows.length)return`<div class="empty"><h3>No dates yet</h3><p>Enter start and end dates on the checklist and they'll show up here.</p></div>`;
  if(TODAY<min)min=TODAY;if(TODAY>max)max=TODAY;
  min=addDays(min,-3);max=addDays(max,7);min=addDays(min,-((parse(min).getDay()+6)%7));
  const PX=16,days=diff(min,max)+1,W=days*PX,L=window.innerWidth<=820?140:230;
  let wk="";for(let i=0;i<days;i+=7)wk+=`<div class="wk" style="left:${i*PX}px">${fmt(addDays(min,i))}</div>`;
  const bar=(r,cls,title,open)=>`<div class="tl-bar ${cls}" style="left:${diff(min,r[0])*PX}px;width:${(diff(r[0],r[1])+1)*PX-2}px" title="${esc(title)}: ${fmt(r[0])} to ${fmt(r[1])}" ${open?`data-open="${open}"`:""}></div>`;
  let h=`<div class="legend"><span><i style="background:var(--ink);opacity:.75"></i>Phase</span><span><i style="background:var(--muted)"></i>Not started</span><span><i style="background:var(--blue)"></i>In progress</span><span><i style="background:var(--green);opacity:.6"></i>Done</span><span><i style="background:var(--red)"></i>Late</span><span><i style="background:var(--yellow)"></i>Today</span></div>
  <div class="tl"><div class="tl-grid" style="width:${W+L}px"><div class="tl-head"><div class="tl-lab">Task</div><div class="tl-track" style="width:${W}px">${wk}</div></div>`;
  for(const{p,pr,list}of rows){
    h+=`<div class="tl-row ph"><div class="tl-lab">${esc(p.name)}</div><div class="tl-track" style="width:${W}px">${pr?bar(pr,"phase",p.name):""}</div></div>`;
    list.sort((a,b)=>a.r[0].localeCompare(b.r[0])).forEach(({t,r,cls})=>{h+=`<div class="tl-row"><div class="tl-lab" title="${esc(t.name)}">${esc(t.name)}</div><div class="tl-track" style="width:${W}px">${bar(r,cls,t.name,j.id+"|"+t.key)}</div></div>`});
  }
  return h+`<div class="today" style="left:${L+diff(min,TODAY)*PX+PX/2}px"></div></div></div>`;
}

      if(e.target.dataset.act==="noteextra"){const f=dlg.__extra;noteFor=null;dlg.close();if(f)f()}});
    dlg.addEventListener("cancel",()=>{noteFor=null})}

function saveNote(){

/* ===== Operations queue: everything the PMs have approved, across all homes ===== */
// only work that belongs to operations: ops-run checklists, materials PMs marked Ready to order,
// inspections marked Ready to schedule, and Additional tasks assigned to someone on the operations team
function opsItems(){
  const out={order:[],insp:[],check:[],todo:[],ordered:[],inspw:[]};
  for(const j of activeJobs()){
    const due=homeDue(j).due||"9999";
    for(const t of allItems(j)){
      if(isNA(j,t))continue;const x=S(j,t.key),open=!isDone(j,t);
      if(OPS_TASKS.has(t.key)){if(CLOSE_KEYS.has(t.key)&&!x.opsReq)continue;const left=t.subs.filter(s=>!subDone(j,s));if(open&&left.length)out.check.push({j,t,due:t.key===PRE_KEY?(preDue(j)||due):due,left,ref:j.id+"|"+t.key});continue}
      const base={j,t,due,ref:j.id+"|"+t.key};
      if(open&&matStage(x)===1)out.order.push({...base,since:x.readyOn||""});
      // stays in the queue after ordering, until it's marked on site
      if(open&&matStage(x)===2)out.ordered.push({...base,since:x.delivDate||""});
      for(const s of t.subs){const y=S(j,s.key);if(!s.f.includes("pf")||y.pf==="pass")continue;
        if(y.isched==="req")out.insp.push({...base,s,ref:j.id+"|"+s.key,since:y.ireqOn||""});
        // stays in the queue after scheduling (or a fail), until it passes
        else if(y.isched||y.pf==="fail")out.inspw.push({...base,s,ref:j.id+"|"+s.key,since:y.schedDate||""})}
    }
    for(const[id,td]of todoList(j))if(!td.done&&isOps(td.who))out.todo.push({j,id,td,due,since:"",end:td.due||""});
  }
  const by=(a,b)=>(a.due<b.due?-1:a.due>b.due?1:0)||((a.since||"9")<(b.since||"9")?-1:1);
  out.check.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);out.order.sort(by);out.ordered.sort(by);out.insp.sort(by);out.inspw.sort(by);out.todo.sort((a,b)=>(a.end||"9")<(b.end||"9")?-1:1);
  return out;
}
// pipeline homes with open to-dos, soonest expected start first
function pipeOps(){return pipeline.filter(p=>!p.archived).map(p=>({p,td:ptodos(p).filter(([,t])=>!t.done)})).filter(x=>x.td.length).sort((a,b)=>(a.p.expStart||"9999").localeCompare(b.p.expStart||"9999"))}
function opsCount(){const o=opsItems();return{open:pipeOps().reduce((a,x)=>a+x.td.length,0)+inbox.length+o.order.length+o.insp.length+o.todo.length+o.ordered.length+o.inspw.length+o.check.reduce((a,c)=>a+c.left.length,0),late:o.todo.some(x=>x.end&&x.end<TODAY)||o.ordered.some(x=>x.since&&x.since<TODAY)||o.inspw.some(x=>S(x.j,x.s.key).pf==="fail"||(x.since&&x.since<TODAY))}}
function addrShort(j){const a=optVal(j,"area")||{};return a.street?a.street+(a.city?", "+a.city:""):""}
// one home per card, its work items listed one per line (most urgent first)
const OPS_KINDS={todo:["To do",0],insp:["Inspection",1],order:["To order",2],check:["Checklist",3],inspw:["Scheduled",4],ordered:["Ordered",5]};
function opsRows(o){
  const by=new Map(),add=(j,row)=>{if(!by.has(j.id))by.set(j.id,{j,rows:[]});by.get(j.id).rows.push(row)};
  o.todo.forEach(it=>add(it.j,{kind:"todo",it}));
  o.insp.forEach(it=>add(it.j,{kind:"insp",it}));
  o.order.forEach(it=>add(it.j,{kind:"order",it}));
  o.check.forEach(it=>it.left.forEach(s=>add(it.j,{kind:"check",it,s})));
  o.inspw.forEach(it=>add(it.j,{kind:"inspw",it}));
  o.ordered.forEach(it=>add(it.j,{kind:"ordered",it}));
  const homes=[...by.values()];
  homes.forEach(h=>h.rows.sort((a,b)=>OPS_KINDS[a.kind][1]-OPS_KINDS[b.kind][1]||((a.it.end||a.it.since||"9")<(b.it.end||b.it.since||"9")?-1:1)));
  const due=j=>homeDue(j).due||"9999";
  return homes.sort((a,b)=>due(a.j)<due(b.j)?-1:due(a.j)>due(b.j)?1:(a.j.name||"").localeCompare(b.j.name||"",undefined,{numeric:true}));
}
function opsLine(r){
  const{kind,it,s}=r,{j,t}=it;
  if(kind==="todo"){const td=it.td,late=td.due&&td.due<TODAY;
    return`<li class="oqrow check"><label class="oqck"><input type="checkbox" data-td="${it.id}" data-tdj="${j.id}" data-tdf="done" aria-label="Done: ${esc(td.text)}"><span class="oqtag todo">To do</span><span class="oqname">${esc(td.text)}</span></label>${td.due?`<small class="${late?"due late":"dim"}">${late?"Overdue ":"Due "}${fmt(td.due)}</small>`:""}<small class="dim">${esc(td.who)}</small></li>`}
  const x=S(j,(it.s||s||t).key);
  let tag=OPS_KINDS[kind][0],name=t.name,act="",meta=it.since?"Requested "+fmt(it.since):"",cls=kind;
  if(kind==="check"){name=s.name;tag={"Pre-Build":"Pre-build","Site prep/excavation":"Site prep","Close Out":"Close out"}[t.name]||t.name;
    return`<li class="oqrow check"><label class="oqck"><input type="checkbox" data-j="${j.id}" data-k="${s.key}" data-f="done" aria-label="${esc(s.name)}"><span class="oqtag check">${esc(tag)}</span><span class="oqname">${esc(name)}</span></label></li>`}
  if(kind==="insp"){name=t.name+" inspection";act=`<button type="button" class="btn primary" data-isched="${it.ref}">Mark scheduled</button>`}
  if(kind==="order")act=`<button type="button" class="btn primary" data-mat="${it.ref}">Mark ordered</button>`;
  if(kind==="ordered"){const dd=x.delivDate;meta=dd?(dd<TODAY?"Delivery was due "+fmt(dd)+", not on site yet":"Delivery "+fmt(dd)):"Ordered, no delivery date yet";act=`<button type="button" class="btn" data-mat="${it.ref}">Mark on site</button>`;if(dd&&dd<TODAY){cls="late";tag="Delivery late"}}
  if(kind==="inspw"){const y=S(j,s?.key||it.s.key),sd=y.schedDate;name=t.name+" "+(/^(call in )?inspection$/i.test(it.s.name)?"inspection":/inspection/i.test(it.s.name)?it.s.name.toLowerCase():it.s.name+" inspection");
    if(y.pf==="fail"){tag="Failed";cls="late";meta="Failed. Schedule a re-inspection, then record the result."}
    else if(sd&&sd<TODAY){tag="No result";cls="late";meta="Was scheduled "+fmt(sd)+". Record pass or fail."}
    else meta=sd?"Scheduled "+fmt(sd):"Scheduled, no date set";
    act=pf(j,it.s.key)}
  return`<li class="oqrow"><span class="oqtag ${cls}">${esc(tag)}</span>
   <div class="oqmain"><button type="button" class="oqtask" data-open="${j.id}|${t.key}">${esc(name)}</button>${meta?`<small class="dim">${esc(meta)}</small>`:""}${noteLine(x)}</div>
   <div class="oqact">${act}</div></li>`;
}

   <div class="oqsum">${(()=>{const pn=pipeOps().reduce((a,x)=>a+x.td.length,0);return pn?`<span class="oqtag pipe">Pipeline to-dos ${pn}</span>`:""})()}${["order","insp","check","todo","inspw","ordered"].filter(k=>n(k)>0).map(k=>`<span class="oqtag ${k}">${{order:"To order",insp:"Inspections to schedule",check:"Checklist items",todo:"To do",inspw:"Awaiting inspection result",ordered:"Awaiting delivery"}[k]} ${n(k)}</span>`).join("")}</div></div>${assetsApi?`<div class="oqdrop" data-drop="1"><b>Drop documents</b><span><label class="linkbtn plain filepick">or choose files<input type="file" id="docFiles" class="vh" multiple accept="${DOC_TYPES.join(",")}"></label></span><small>Claude reads each one and files it to the right home</small></div>`:""}</div>
   ${pendingDocs.length?`<div class="oqpq">${pqListHTML()}<div class="docrow" style="justify-content:flex-end"><button type="button" class="btn" data-act="pqclear">Clear</button><button type="button" class="btn primary" data-act="pqupload" ${uploading?"disabled":""}>${uploading?"Uploading…":`Upload ${pendingDocs.length} file${pendingDocs.length===1?"":"s"}`}</button></div></div>`:""}</div><div class="body opsgrid">`;
  const po=pipeOps(),allK=[...po.map(x=>"p:"+x.p.id),...homes.map(x=>x.j.id)];
  if(allK.length>1){const anyOpen=allK.some(k=>!oqClosed.has(k));h+=`<div class="oqall"><button type="button" class="linkbtn plain" data-oqall="${anyOpen?"close":"open"}">${anyOpen?"Collapse all":"Expand all"}</button></div>`}

      <div class="oqhd"><button type="button" class="oqhome" data-oqpipe="${p.id}">${esc(p.name)}</button>
      <small class="dim">${[p.address||p.subdivision||"",p.super?"Super "+p.super:"",p.pm?"PM "+p.pm:""].filter(Boolean).map(esc).join(" · ")}</small></div>
      <span class="oqdue">${p.expStart?`${fmt(p.expStart)} <small class="dim">${days>=0?days+" days":"start passed"}</small>`:`<small class="dim">No start date</small>`}</span><span class="oqn">${td.length}</span></div>
     <ul class="oqlist">${td.map(([id,t])=>`<li class="oqrow check"><label class="oqck"><input type="checkbox" data-ptd="${p.id}|${id}" aria-label="Done: ${esc(t.text)}"><span class="oqname">${esc(t.text)}</span></label></li>`).join("")}</ul></section>`}
  if(!homes.length&&!po.length)return h+`<div class="empty"><h3>Nothing in the queue</h3><p>Items show up here as PMs mark materials Ready to order, inspections Ready to schedule, or assign Additional tasks to operations.</p></div></div>`;
  for(const{j,rows}of homes){
    const a=addrShort(j),u=dueSummary(j);
    h+=`<section class="oq${oqClosed.has(j.id)?" closed":""}"><div class="oqh" data-oqh="${j.id}">${oqTog(j.id,j.name)}<span class="sdot s-${homeStatus(j).v}" title="${statusName(homeStatus(j).v)}"></span>

      <span class="oqdue ${u.cls}">${esc(u.big)}${homeDue(j).due?` <small class="dim">left</small>`:""}</span><span class="oqn">${rows.length}</span></div>
     <ul class="oqlist">${rows.map(opsLine).join("")}</ul></section>`;
  }
  return h+`</div>`;
}
